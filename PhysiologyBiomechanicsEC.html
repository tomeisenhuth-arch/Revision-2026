const QS=[
  // BIOMECHANICS
  {id:"Q1",sub:"Biomechanics",q:"Different types of data are collected from laboratory or field tests.\n\nWhich one of the following terms is used to describe data which is based on judgement on how well a test was performed?\nA) Objective\nB) Reliable\nC) Subjective\nD) Valid",marks:1,ao:"AO1",ms:"C – Subjective",er:"A straightforward recall MCQ. Subjective data is based on opinion or interpretation. Objective data is factual and measurable. Students most commonly confused subjective with unreliable.",type:"mcq",answer:"C"},
  {id:"Q2",sub:"Biomechanics",q:"A discus will generate lift when thrown with the optimal angle of attack.\n\nWhich one of the following correctly describes the air flow and resulting pressure change when this occurs?\nA) Air passing over the discus travels further than the air passing under it, decreasing the pressure above the discus.\nB) Air passing over the discus travels further than the air passing under it, increasing the pressure above the discus.\nC) Air passing under the discus travels further than the air passing over it, decreasing the pressure below the discus.\nD) Air passing under the discus travels further than the air passing over it, increasing the pressure below the discus.",marks:1,ao:"AO2",ms:"A – Air passing over travels further, decreasing pressure above (Bernoulli principle — fast airflow = low pressure).",er:"The Bernoulli principle: where air travels further (over the discus at optimal angle of attack) it moves faster, creating LOW pressure. The higher pressure below creates lift. Students commonly confused which side has fast/slow air flow.",type:"mcq",answer:"A"},
  {id:"Q3",sub:"Biomechanics",q:"Linear motion involves both vector and scalar quantities.\n\nGive three examples of scalar quantities.",marks:3,ao:"AO1",ms:"Any 3 of: speed / distance / mass / time / temperature / energy (1 each)\nDo NOT accept: velocity / displacement / acceleration / force (these are vectors)\nMax 3 marks",er:"A well answered AO1 recall question with a mean of just over 2. Around 50% of students achieved all 3 marks. The most common error was giving vector quantities such as velocity or displacement instead of their scalar equivalents (speed and distance).",type:"written"},
  {id:"Q4",sub:"Injury & Rehabilitation",q:"One example of a common sports injury is a sprain.\n\nDescribe a sprain.",marks:1,ao:"AO1",ms:"Stretching or tearing of a ligament (1)\nMust reference ligament for the mark.\nMax 1 mark",er:"Around 64% of students answered correctly. The most common incorrect answer was describing damage to a muscle (which is a strain, not a sprain). Students must link sprain specifically to LIGAMENT damage.",type:"written"},
  {id:"Q5",sub:"Injury & Rehabilitation",q:"Explain how three different methods of injury prevention could decrease the likelihood of a sprain.",marks:3,ao:"AO2",ms:"Award 1 mark per explained method (must have connective showing WHY):\n• Warm up properly (so muscles/connective tissue are more pliable and less likely to tear under sudden stress). (1)\n• Taping/bracing of vulnerable joints (so the joint is stabilised reducing excessive movement that could tear a ligament). (1)\n• Strengthening exercises for muscles around vulnerable joints (so muscles support the joint more effectively, reducing strain on ligaments). (1)\n• Wearing appropriate footwear (so the ankle/foot is supported reducing risk of sudden inversion). (1)\n• Screening/pre-participation assessment (so existing weaknesses are identified and addressed before injury occurs). (1)\nMax 3 marks — must explain (use 'so' or 'because' connecting method to reason)",er:"Just over 20% of students achieved full marks. The command word 'explain' requires a connective identifying why the strategy reduces injury risk. Many students simply stated strategies without explaining the mechanism — e.g. 'do a warm up' without explaining why this reduces sprain risk.",type:"written"},
  {id:"Q6",sub:"Injury & Rehabilitation",q:"Evaluate the effectiveness of the diver using PNF (Proprioceptive Neuromuscular Facilitation) as a training method.",marks:3,ao:"AO3",ms:"Positives (sub max 2):\n• PNF produces greater gains in flexibility than static stretching — important for dive entry position and body shape. (1)\n• Engages the proprioceptors/Golgi tendon organ — prevents protective stretch reflex allowing greater range of motion. (1)\nNegatives (sub max 2):\n• Requires a partner which may not always be available. (1)\n• Risk of injury if partner applies too much pressure/technique applied incorrectly. (1)\n• More time consuming than other methods. (1)\n• Needs to be learned correctly before being used safely. (1)\nMax 3 marks — must include both positives and negatives with IMPACT stated.",er:"Mean mark approximately 1.2. Most common mark was 1. Students attempted to give both positives and negatives. However they were often unsuccessful due to a lack of depth — unable to provide the impact on the diver. E.g. stating 'PNF requires a partner' without saying what impact this has on the diver's ability to use this method.",type:"written"},
  {id:"Q8",sub:"Injury & Rehabilitation",q:"Which one of the following is an acute injury?\nA) Achilles tendonitis\nB) Dislocated shoulder\nC) Tibial stress fracture",marks:1,ao:"AO1",ms:"B – Dislocated shoulder\nAcute injuries have sudden onset. Achilles tendonitis and tibial stress fractures are chronic/overuse injuries.",er:"Around 84% of students correctly identified dislocated shoulder as an acute injury. An acute injury has a sudden onset — dislocations, fractures, sprains from a single incident.",type:"mcq",answer:"B"},
  {id:"Q9",sub:"Biomechanics",q:"Which one of the following is a correct unit of measurement for acceleration?\nA) Metres (m)\nB) Metres per second (m/s)\nC) Metres per second squared (m/s²)\nD) Seconds (s)",marks:1,ao:"AO1",ms:"C – Metres per second squared (m/s²)\nAcceleration = change in velocity ÷ time = (m/s) ÷ s = m/s²",er:"Around 73% correctly answered. m/s is velocity; m/s² is acceleration (change in velocity per unit time).",type:"mcq",answer:"C"},
  {id:"Q10",sub:"Biomechanics",q:"State three factors which affect stability.",marks:3,ao:"AO1",ms:"Award 1 mark each for any 3 of:\n• Height of centre of mass (1)\n• Width/size of base of support (1)\n• Mass of performer (1)\n• Line of gravity (whether it falls within base of support) (1)\n• Friction between performer and surface (1)\nMax 3 marks",er:"Mean approximately 1.7. Majority achieved 1 or 2 marks. Common errors: referring to 'centre of mass' without specifying 'height' of centre of mass; referring to 'base of support' without specifying 'width/area' of base. Very few students failed to score at least 1 mark.",type:"written"},
  {id:"Q11",sub:"Biomechanics",q:"Height of release and speed of release are two factors affecting the horizontal displacement of a projectile.\n\nName one other factor which affects the horizontal displacement of a projectile.",marks:1,ao:"AO1",ms:"Angle of release (1)\n(Also accept air resistance / weight of the object as valid alternatives)\nMax 1 mark",er:"A very well answered question. Angle of release was the most common response. A few students put air resistance or weight but very few failed to get the mark.",type:"written"},
  {id:"Q13",sub:"Biomechanics",q:"Analyse how the gymnast makes use of the principle of conservation of angular momentum when performing a front tuck somersault.",marks:3,ao:"AO2",ms:"Award 1 mark each for any 3 analysed points:\n• Angular momentum = moment of inertia × angular velocity, and remains constant throughout the somersault. (1)\n• At take-off the gymnast is in an open/extended position — high moment of inertia, low angular velocity. (1)\n• In the tucked position, mass is drawn closer to the axis of rotation — moment of inertia decreases, angular velocity increases (faster rotation). (1)\n• On landing, the gymnast opens out — moment of inertia increases again, angular velocity decreases (slows rotation for controlled landing). (1)\nMax 3 marks — answers without key terminology (moment of inertia, angular velocity) will be limited to 2 marks.",er:"A significant number scored zero because they did not apply key terminology. Mentioning 'tuck position' and 'increased speed of rotation' was insufficient without linking to MOMENT OF INERTIA. Around 22% of students scored 3 marks.",type:"written"},
  {id:"Q17",sub:"Biomechanics",q:"Explain how the swimming costume, swim cap, and body hair removal all reduce drag on a swimmer.",marks:3,ao:"AO2",ms:"Award 1 mark each for any 3 explained points:\n• Tight swimsuit/tech suit (reduces skin friction/form drag by creating a smoother surface). (1)\n• Swim cap (reduces profile drag from hair/streamlines the head shape). (1)\n• Body hair removal/shaving (reduces surface friction drag allowing water to flow over skin more smoothly). (1)\n• (Accept other valid streamlining adaptations with explanation)\nMax 3 marks — each point must include the mechanism (HOW it reduces drag).",er:"Mean mark approximately 2.3. Well answered. Students who lost marks either used examples not related to swimming (tight clothing generally) or did not specifically relate the example to the mechanism of drag reduction. Most could get marks for swim cap/costume/shave hair.",type:"written"},
  {id:"Q18",sub:"Biomechanics",q:"State Newton's first law of angular motion.",marks:1,ao:"AO1",ms:"A rotating body will continue to rotate at a constant angular velocity unless acted upon by an external torque/force. (1)\nMax 1 mark",er:"Roughly 37% could correctly state Newton's first law of angular motion. Many students stated the LINEAR version (body remains at rest/uniform motion). The angular version requires reference to 'constant angular velocity' not just 'constant motion'.",type:"written"},
  {id:"Q19",sub:"Biomechanics",q:"Analyse how Newton's laws of angular motion account for changes in a figure skater's speed of rotation during a spin.",marks:3,ao:"AO3",ms:"Award 1 mark each for analysed points:\n• Newton's 1st law: once the skater begins spinning, angular momentum is conserved — they will continue to spin at the same rate unless acted upon by external torque. (1)\n• Newton's 2nd law: when the skater brings arms in close to body, moment of inertia decreases, causing angular acceleration (increased angular velocity). (1)\n• Newton's 3rd law: the force applied to the ice by the skater to initiate the spin results in an equal and opposite reaction force from the ice that initiates the rotation. (1)\nMax 3 marks",er:"Approximately 4% achieved full marks — mean 0.6. The two common mistakes: (1) simply describing the law without applying it to the figure skater; (2) describing conservation of angular momentum rather than Newton's Laws. Newton's 3rd law applied to the INITIATION of the spin was rarely attempted.",type:"written"},
  {id:"Q20",sub:"Biomechanics",q:"Which one of the following describes a second-class lever?\nA) The effort is between the fulcrum and the resistance\nB) The fulcrum is between the effort and the resistance\nC) The resistance is between the fulcrum and the effort",marks:1,ao:"AO1",ms:"C – The resistance is between the fulcrum and the effort\n(1st class: fulcrum in middle; 2nd class: resistance in middle; 3rd class: effort in middle)",er:"Students performed well, with a mean of nearly 0.9.",type:"mcq",answer:"C"},
  {id:"Q21",sub:"Biomechanics",q:"Which of the following describes a third-class lever?\nA) Effort between fulcrum and resistance\nB) Fulcrum between effort and resistance\nC) Resistance between fulcrum and effort",marks:1,ao:"AO1",ms:"A – Effort between fulcrum and resistance\nMost levers in the body are 3rd class. High speed/range of motion but mechanical disadvantage.",er:"Around 60% of students answered correctly. Approximately 40% confused with other lever classes.",type:"mcq",answer:"A"},
  {id:"Q22",sub:"Data & Testing",q:"Define qualitative data and state one method used to collect it.",marks:2,ao:"AO1",ms:"Qualitative data: Data based on opinion/description/interpretation/not numerical. (1)\nMethod: Observation/interview/questionnaire/video analysis. (1)\nMax 2 marks\nNote: students should not state quantitative data is always factual and objective — PRE scores are quantitative but subjective.",er:"Mean approximately 1.7. Generally successful though there was a common misconception that quantitative data is always factual and objective. A coach asking an athlete for a Perceived Rate of Exertion (PRE) score gives quantitative but subjective data.",type:"written"},
  {id:"Q23",sub:"Data & Testing",q:"Define reliability in the context of sports testing.",marks:2,ao:"AO1",ms:"Reliability: The extent to which a test or method produces consistent and repeatable results. (1)\nA test can be reliable even if not accurate — it consistently measures the same (even if wrong) value. (1)\nMax 2 marks",er:"Mean approximately 0.8 — considerably lower than the corresponding validity question. Students confused reliability with accuracy. A test is reliable if it gives the same result each time — even if that result is not the correct one. Accuracy is a separate concept.",type:"written"},
  {id:"Q24",sub:"Biomechanics",q:"Define vector quantity.",marks:1,ao:"AO1",ms:"A quantity that has both magnitude (size) AND direction. (1)\nMust include BOTH magnitude and direction.\nMax 1 mark",er:"Mean approximately 0.4 — fewer than half of students answered correctly. Many knew there were two key parts but couldn't identify the correct terms, often citing 'speed' instead of 'magnitude'. Both MAGNITUDE and DIRECTION must be referenced.",type:"written"},
  {id:"Q25",sub:"Biomechanics",q:"A sprinter accelerates from 4 m/s to 10 m/s over 3 seconds.\n\nCalculate the sprinter's acceleration. Show your working and include the correct units.",marks:2,ao:"AO2",ms:"Acceleration = change in velocity ÷ time = (10 - 4) ÷ 3 = 2 m/s² (1 mark for method, 1 for correct answer with units)\nMax 2 marks",er:"Mean around 0.7. Only around 14.5% achieved both marks. The most commonly awarded mark was for correct units. Students could identify the formula but made arithmetic errors or omitted units.",type:"written"},
  {id:"Q26",sub:"Training & Fitness",q:"Evaluate the use of High Intensity Interval Training (HIIT) for improving the performance of a netball or basketball player.",marks:3,ao:"AO3",ms:"Positives (sub max 2):\n• HIIT improves aerobic and anaerobic capacity needed for high-intensity bursts in netball/basketball. (1)\n• Time efficient method — players can achieve significant adaptations in shorter sessions. (1)\n• Replicates the stop-start nature of netball/basketball better than steady-state training. (1)\nNegatives (sub max 2):\n• High injury risk from intense effort — missed training/games leading to reversibility. (1)\n• Not suitable for all players — those with low base fitness may not be able to sustain HIIT safely. (1)\n• Fatiguing — can impact subsequent training/match performance if not managed correctly. (1)\nMax 3 marks — must give impact after each point.",er:"Mean around 1. Students clearly had the knowledge but failed to provide sufficient depth. Stating 'HIIT improves anaerobic power' without identifying HOW this helps a netballer/basketballer specifically. Points such as injury risk were not developed to give the impact on performance. Always explain the consequences.",type:"written"},
  {id:"Q46",sub:"Training & Fitness",q:"Describe how the principles of progressive overload and specificity could be used in a weight training programme for a tennis player.",marks:3,ao:"AO1",ms:"Progressive overload (sub max 2):\n• Gradually increase the load/weight lifted over time. (1)\n• Increase number of repetitions/sets/reduce rest periods. (1)\nSpecificity (sub max 2):\n• Target muscles used in tennis — rotator cuff/core/forearm muscles. (1)\n• Use similar movement patterns to tennis shots. (1)\nMax 3 marks — sub max 2 per principle. The command word is DESCRIBE — do not penalise for elaboration but description is what's required.",er:"77% gained 2 or 3 marks. Students described progressive overload more successfully than specificity. For specificity, simply mentioning 'making training most relevant to the tennis player' was the most common approach — more specific muscle/movement references gained higher marks. Sub-max marking meant max 2 marks from either principle alone.",type:"written"},
  {id:"Q47",sub:"Training & Fitness",q:"Discuss the advantages and disadvantages of weight training for improving the performance of a tennis player.",marks:3,ao:"AO3",ms:"Advantages (sub max 2 with impact):\n• Increased strength → greater shot force making it harder for opponent to return. (1)\n• Increased strength → faster serve/more aces. (1)\n• Injury prevention through strengthening muscles around vulnerable joints. (1)\nDisadvantages (sub max 2 with impact):\n• Risk of injury during weight training → missed training/matches leading to reversibility. (1)\n• Hypertrophy may impair flexibility needed for overhead/wide shots. (1)\n• Time consuming — takes time away from skill/technical training. (1)\nMax 3 marks — must identify IMPACT not just state advantage/disadvantage.",er:"Only 4% achieved full marks; 40% achieved 2 marks. The command word 'discuss' requires advantages AND disadvantages with their impact on performance. Identifying strength gains was not enough — students needed to say HOW increased strength improves tennis performance specifically.",type:"written"},
  {id:"Q48",sub:"Data & Testing",q:"A runner completes 400m in 1 minute and 20 seconds.\n\nCalculate the runner's average speed in m/s. Show your working.",marks:1,ao:"AO2",ms:"Speed = distance ÷ time = 400 ÷ 80 = 5 m/s (1)\n(1 minute 20 seconds = 80 seconds)\nMax 1 mark",er:"95% of students correctly answered this question — the most successfully answered calculation question on the paper. The key step was converting 1 minute 20 seconds to 80 seconds before dividing.",type:"written"},
  {id:"Q49",sub:"Nutrition",q:"Which one of the following is a function of sodium in exercise?\nA) Helps regulate body fluid levels\nB) Helps transport oxygen in the blood\nC) Needed for formation of haemoglobin\nD) Provides structural support for bones",marks:1,ao:"AO1",ms:"A – Helps regulate body fluid levels\nSodium is an electrolyte that regulates fluid balance. Haemoglobin requires iron, not sodium.",er:"85% of students correctly identified sodium's exercise function as regulating body fluid levels. The most common incorrect answer was 'needed for formation of haemoglobin' — this requires IRON.",type:"mcq",answer:"A"},
  {id:"Q50",sub:"Data & Testing",q:"Define subjective data. State one method used to collect subjective data in sport.",marks:2,ao:"AO1",ms:"Subjective data: Based on personal interpretation, opinion or judgement — not purely numerical/factual. (1)\nMethod: RPE (Rate of Perceived Exertion) scale / observational assessment / questionnaire / coach observation. (1)\nMax 2 marks",er:"Around 68% achieved maximum marks. Most students identified subjective data as opinion or interpretation, with questionnaires as the most popular collection method.",type:"written"},
  {id:"Q51",sub:"Injury & Rehabilitation",q:"State three purposes of screening in sport.",marks:3,ao:"AO1",ms:"Award 1 mark for any 3 of:\n• Identify current/past/previous injuries. (1)\n• Identify conditions such as cardiac abnormalities (e.g. CRY screening). (1)\n• Assess muscle imbalances. (1)\n• Assess joint mobility/range of movement. (1)\n• Identify postural alignment issues. (1)\n• Assess core strength. (1)\nMax 3 marks",er:"Most students scored some marks — mean 1.54 out of 3. Students identified screening correctly as being under injury prevention and rehabilitation. Identifying CRY (Cardiac Risk in the Young) was a well-known purpose. Testing for muscle imbalances and assessing joint mobility were less commonly cited.",type:"written"},
  {id:"Q52",sub:"Nutrition",q:"A 200m sprinter is considering using creatine monohydrate supplementation.\n\nDiscuss the potential advantages and disadvantages of creatine monohydrate for a 200m sprinter.",marks:5,ao:"AO2/AO3",ms:"Advantages (sub max 3):\n• Creatine increases PC stores → faster ATP resynthesis → sprinter can maintain maximum sprint effort for longer. (1)\n• Reduces recovery time between reps in training → more effective sprint training sessions. (1)\n• Increases lean muscle mass → greater force production → faster sprint start. (1)\nDisadvantages (sub max 3):\n• Water retention → increased body mass → may slow the sprinter (important at 200m). (1)\n• Potential for stomach cramps/muscle cramps/dehydration. (1)\n• Evidence for benefit at 200m is mixed — most research supports benefits for efforts under 30 seconds. (1)\n• Question the benefits — research is inconclusive for longer sprints. (1)\n• Expense/availability issues. (1)\nMax 5 marks",er:"Well answered — pleasing to see application to the 200m sprinter being made. Students should consider the context — the advantages and disadvantages need to be specifically impacted upon the sprinter. Expense and side effects were common additional considerations that gained credit.",type:"written"},
  {id:"Q53",sub:"Biomechanics",q:"Which one of the following is a scalar quantity?\nA) Acceleration\nB) Displacement\nC) Mass\nD) Velocity",marks:1,ao:"AO1",ms:"C – Mass\nMass has magnitude only (no direction). Acceleration, displacement and velocity are all vectors (have direction).",er:"61% correctly identified mass as a scalar quantity. The least accessible MCQ on the paper. Students most commonly incorrectly identified displacement (a vector).",type:"mcq",answer:"C"},
  {id:"Q54",sub:"Injury & Rehabilitation",q:"Which one of the following is an acute injury?\nA) Achilles tendinopathy\nB) Shin splints\nC) Sprained ankle",marks:1,ao:"AO1",ms:"C – Sprained ankle (acute — sudden onset from a specific incident)\nAchilles tendinopathy and shin splints are both chronic/overuse injuries.",er:"71% correctly identified sprained ankle. Strain was the most common incorrect answer — students confused sprain (ligament) with strain (muscle).",type:"mcq",answer:"C"},
  {id:"Q55",sub:"Biomechanics",q:"A long jumper is in flight during their jump.\n\nExplain two external forces acting on the athlete during flight.",marks:4,ao:"AO2",ms:"Award up to 2 marks per force:\nAir resistance:\n• Acting in the opposite direction to the jumper's travel. (1)\n• Depends on the velocity of the jumper/cross-sectional area/streamlining. (1)\nWeight/Gravity:\n• Pulling the jumper downwards towards the sand pit. (1)\n• The greater the mass of the jumper the greater the weight force. (1)\nMax 4 marks",er:"85% achieved at least 3 marks — the majority identified two forces. Students who lost marks failed to explain WHY air resistance acts in the opposite direction of travel, or gave vague descriptions of gravity without mentioning downward direction.",type:"written"},
  {id:"Q56",sub:"Biomechanics",q:"The long jump take-off uses a third-class lever system at the hip.\n\n(a) State the mechanical advantage of a third-class lever.\n(b) Explain how this advantage helps the long jumper to jump further.",marks:2,ao:"AO1/AO3",ms:"(a) AO1: Large range of movement / resistance/load can be moved quickly (mechanical disadvantage in terms of force but advantage in speed/range). (1)\n(b) AO3: By moving the legs forwards quickly (flexing at the hip) the jumper throws their legs ahead of them generating forward momentum and jumping further. (1)\nMax 2 marks",er:"Only 7% achieved both marks. Many students could not recognise the mechanical advantage (speed/range) of a third-class lever. Even fewer applied it specifically to how this allows the long jumper to jump further.",type:"written"},
  {id:"Q57",sub:"Flexibility & Stretching",q:"Define ballistic stretching.",marks:1,ao:"AO1",ms:"Ballistic stretching involves fast bouncing or swinging movements, using the momentum of a moving body to force it beyond its normal range of motion. (1)\nMax 1 mark",er:"68% of students secured the mark. Terms such as 'bouncing' or 'swinging' were key. Disappointing that many achieved zero for incorrectly using the term 'bounding' — this describes a plyometric action, not a stretch.",type:"written"},
  {id:"Q58",sub:"Flexibility & Stretching",q:"Discuss the suitability of ballistic stretching for a long jumper.",marks:3,ao:"AO3",ms:"Suitable (sub max 2):\n• Improves dynamic flexibility at the hip — vital for effective take-off drive in the long jump. (1)\n• Fast dynamic contractions in ballistic stretching mirror the explosive nature of the long jump action. (1)\nNot suitable (sub max 2):\n• Risk of injury if done incorrectly/without adequate warm-up or if athlete lacks base flexibility. (1)\n• Static or PNF stretching may be safer alternatives for building flexibility without injury risk. (1)\nMax 3 marks",er:"A good discriminator. Positives and negatives both required. Students who stated 'improved flexibility' without linking to hip/take-off action in the long jump were considered too vague. Both sides must be present AND each must have an explained impact.",type:"written"},
  {id:"Q59",sub:"Training & Fitness",q:"Define and give an example of each of the following training phases:\nA) Microcycle\nB) Mesocycle\nC) Macrocycle",marks:3,ao:"AO1",ms:"A: Microcycle – periods of a week/day/individual training sessions. (1)\nB: Mesocycle – periods of two to eight weeks/months. (1)\nC: Macrocycle – yearly/two-yearly cycle/Olympic cycle (e.g. 4 years). (1)\nMust state the term AND a correct time-based description for each mark.\nMax 3 marks",er:"The question stated the specific phases to be explained rather than an open-ended question. Over 70% achieved maximum marks. Students who failed typically gave descriptions without the correct time periods.",type:"written"},
  {id:"Q60",sub:"Biomechanics",q:"During a 100m race a sprinter produces different impulse-momentum graphs at different stages:\n• Start of race (accelerating hard)\n• Middle of race (at maximum velocity)\n• End of race (beginning to fatigue)\n\nDescribe the impulse-momentum relationship at each stage.",marks:3,ao:"AO2",ms:"Start (accelerating): Net positive impulse — positive force > negative force — acceleration occurring. (1)\nMiddle (max velocity): Net zero impulse — positive force = negative force — velocity constant. (1)\nEnd (fatiguing): Net negative impulse — negative force > positive force — deceleration occurring. (1)\nMax 3 marks",er:"Well answered — popular question. The majority correctly identified the correct impulse graph for each phase. Those who failed to achieve marks often failed to use appropriate biomechanical terms or gave vague descriptions of the graphs without referencing net force relationships.",type:"written"},

  // NUTRITION
  {id:"Q14",sub:"Nutrition",q:"Which dietary supplement would improve the mobilisation of fatty acids in the body?\nA) Caffeine\nB) Creatine\nC) Sodium bicarbonate\nD) Whey protein",marks:1,ao:"AO1",ms:"A – Caffeine\nCaffeine stimulates the mobilisation of free fatty acids from adipose tissue, sparing glycogen.",er:"Only 40% of students correctly identified caffeine as improving fatty acid mobilisation. Creatine was the most common incorrect answer — creatine replenishes PC stores, not fatty acid mobilisation.",type:"mcq",answer:"A"},

  // TRAINING
  {id:"Q16",sub:"Training & Fitness",q:"Describe the training focus for each phase of a periodised programme:\nA) Preparation phase\nB) Competition phase\nC) Transition phase",marks:3,ao:"AO1",ms:"A: Preparation — building general fitness/aerobic base/strength/sport-specific fitness. (1)\nB: Competition — maintaining fitness/peaking for competition/working on tactics and skills. (1)\nC: Transition — active recovery/rest/low intensity activity/cross training (must be active recovery or equivalent). (1)\nMax 3 marks",er:"Mean approximately 1.45. Some students failed to refer to the transition phase as active recovery, instead stating 'rest' which was not accepted without the active component. Preparation and competition phases were generally well described.",type:"written"},

  // ===== EXERCISE PHYSIOLOGY — full paper (EP1–EP60) + extra questions (EP61–EP68) =====
  {"id": "EP1", "sub": "Energy Systems", "q": "Which one of the following is converted directly into lactic acid in the anaerobic glycolytic energy system?\nA) Acetyl coenzyme A\nB) Citric acid\nC) Glucose\nD) Pyruvic acid", "marks": 1, "ao": "AO1", "ms": "D – Pyruvic acid", "er": "Students found this question relatively easy, with over three quarters of students able to identify the correct answer. This demonstrates a good understanding of the process which occurs during aerobic respiration.", "type": "mcq", "answer": "D"},
  {"id": "EP2", "sub": "Movement Analysis", "q": "The figure below shows a tennis player performing a forehand shot as they move from position A to B.\nWhich one of the following is the plane of movement for the joint action at the elbow from position A to B?\nA) Frontal\nB) Sagittal\nC) Transverse", "marks": 1, "ao": "AO2", "ms": "B – Sagittal", "er": "Students did not perform as well on this question, with a mean mark of approximately 0.45. This would suggest the question was more in line with the expected difficulty of a multiple-choice question, but by no means difficult. Students continue to find planes and axis a challenging topic, with this question highlighting the misconception that flexion or extension at the elbow occurs in transverse plane when the arm is horizontal to the floor. Flexion and extension always occur in the sagittal plane.", "type": "mcq", "answer": "B", "img": "tennis_fh"},
  {"id": "EP3", "sub": "Cardiovascular System", "q": "During exercise CO2 in the blood will increase.\nDescribe how an increase in blood CO2 impacts the redistribution of blood.", "marks": 3, "ao": "AO1", "ms": "• (Increased CO2 levels/acidity/decrease in pH) detected by chemoreceptors. (1)\n• Messages sent to the medulla (oblongata) / vasomotor centre. (1)\n• Increased sympathetic impulses / decreased parasympathetic impulses. (1)\n• Vasodilation / increased blood flow to the working muscles/skin/heart. (1)\n• Precapillary sphincters relax to allow more blood through. (1)\n• Vasoconstriction / decreased blood flow to the non-essential organs/non-working muscles. (1)\n• Precapillary sphincters contract causing to allow less blood through. (1)\nAccept any other appropriate description of how an increase in blood CO2 impacts the redistribution of blood.\nMaximum 3 marks", "er": "This question had a mean mark of approximately 1.5, with around 32% of students achieving full marks. This type of question has been asked previously linked to an increase in heart rate and it was obvious that a number of students had rote learned and repeated this mark scheme. References to the heart were not creditworthy in this question and the best answers were the ones that recognised the needs to describe the processes of vasodilation and vasoconstriction.", "type": "written"},
  {"id": "EP4", "sub": "Respiratory System", "q": "As a direct gas analysis VO2 max test progresses, minute ventilation would increase.\nDefine 'minute ventilation'.", "marks": 1, "ao": "AO1", "ms": "• Amount of air breathed in or out per minute. (1)\n• Breathing rate x tidal volume. (1)\nAccept any other appropriate definition of minute ventilation.\nMaximum 1 mark", "er": "This question had a mean mark of approximately 0.4, with a number of students missing out on the mark as they defined minute ventilation as the amount of air breathed in and out per minute. As with definitions of tidal volume the misconception that the measurement is in and out, instead of in or out, is a common one. Students can be credited for stating one or the other, eg minute ventilation as the amount of air breathed in per minute.", "type": "written"},
  {"id": "EP5", "sub": "Respiratory System", "q": "Explain why minute ventilation needs to increase as the intensity of exercise gets harder.", "marks": 3, "ao": "AO2", "ms": "• To allow the athlete to breath in more O2. (1)\n• To allow the athlete to remove more CO2. (1)\n• To increase gas exchange at the alveoli / fully saturate haemoglobin. (1)\n• Delivers more oxygen to the working muscles / meets increased demand for oxygen. (1)\n• To allow the performer to continue to respire aerobically / prevent anaerobic respiration. (1)\n• Delay fatigue / delay OBLA / limit lactate accumulation. (1)\nAccept any other appropriate explanation of why minute ventilation would need to increase as the intensity of work got harder.\nMaximum 3 marks", "er": "This question required students to apply their knowledge of minute ventilation to a VO2max test. Despite their difficulties with producing an accurate definition, students obviously had some knowledge of this topic as around 93% were able to access at least one mark. Nearly 30% were awarded full marks.", "type": "written"},
  {"id": "EP6", "sub": "Health & Exercise", "q": "Analyse how regular participation in exercise can decrease the likelihood of a stroke.", "marks": 3, "ao": "AO3", "ms": "• The elasticity / condition of the arteries is maintained which ensures blood flow to the brain remains constant. (1)\n• Reduced cholesterol (LDL) / atheroma / fatty deposits / plaque which prevents blockages in blood vessels (leading to the brain) / ischemic stroke. (1)\n• A decrease in blood pressure which prevents damage to blood vessels (leading to the brain) / haemorrhagic stroke. (1)\nAccept any other appropriate analysis of how regular participation in exercise can decrease the likelihood of a stroke.\nMaximum 3 marks", "er": "This question was the first of the short answer AO3 questions which students generally find challenging. This continued to be the case, with the mean mark falling just under 1 out of 3 possible marks. Where students did achieve marks, they understood the need to link the impact of regular participation in exercise to the cause of a stroke, analysing how the risk was reduced. There was frequent evidence of students having knowledge of the different types of strokes (haemorrhagic and ischemic). Only a very small number of students were able to access the full three marks for this question as the first marking point regarding exercise maintaining the elasticity of blood vessels was very seldom awarded.", "type": "written"},
  {"id": "EP7", "sub": "Respiratory System", "q": "Which lung volume will be lower during exercise than at rest?\nA) Inspiratory reserve volume\nB) Minute ventilation\nC) Residual volume\nD) Tidal volume", "marks": 1, "ao": "AO1", "ms": "A – Inspiratory reserve volume", "er": "Students found this question relatively easy with around three quarters of students able to identify inspiratory reserve volume as the lung volume which would be lower during exercise than at rest. This is a topic which is commonly assessed, and students appear familiar with it.", "type": "mcq", "answer": "A"},
  {"id": "EP8", "sub": "Movement Analysis", "q": "The figure shows an athlete performing a squat.\nWhich one of the following best describes the action of the quadriceps muscle group between position A and position B?\nA) Contracting concentrically\nB) Contracting eccentrically\nC) Contracting isometrically\nD) Relaxing as the antagonist", "marks": 1, "ao": "AO2", "ms": "B – Contracting eccentrically", "er": "Students did not perform as well on this question with a mean mark of just under 0.65. This would suggest the question was more in line with the expected difficulty of a multiple-choice question, but by no means difficult (represented by a mean mark of less than 0.35). This question targeted a common misconception regarding muscle contractions during downwards movements.", "type": "mcq", "answer": "B", "img": "squat_lift"},
  {"id": "EP9", "sub": "Movement Analysis", "q": "The figure shows a badminton player in two different positions as they prepare to hit a shot.\n\nFor the movement at the left hip as the player moves from position A to position B, give:\n• the two articulating bones\n• the type of joint\n• the plane\n• the axis", "marks": 4, "ao": "AO1/AO2", "ms": "Articulating bones: Pelvis and femur (1)\nType of joint: Ball and socket (1)\nPlane: Frontal (1)\nAxis: Sagittal (1)\nAccept any other appropriate articulating bones.\nMax 4 marks", "er": "This question involved the completion of a table based on movement analysis which students will be familiar with. There were two AO1 marks and two AO2 marks available. The mean mark for the question was nearly 3. 4 was the most commonly awarded mark (approximately 45% of students), followed by 2 (approximately 23.5% of students). Most students were able to access the two AO1 marks for naming the articulating bones and type of joint. Where students failed to access marks above 2 it was generally due their inability to identify the plane and axis of movement (AO2).", "type": "written", "img": "badminton"},
  {"id": "EP10", "sub": "Cardiovascular System", "q": "Describe the role of the sympathetic and parasympathetic nervous systems in the regulation of heart rate.", "marks": 3, "ao": "AO1", "ms": "• Medulla/cardiac control centre sends impulse to the Sino-atrial node (SAN)/pacemaker. (1)\n• Sympathetic nervous system increases heart rate. (1)\n• Sympathetic impulses travel down the sympathetic/accelerator nerve. (1)\n• Parasympathetic nervous system decreases heart rate. (1)\n• Parasympathetic nervous systems travel down the vagus nerve. (1)\nAccept any other appropriate description the role of the sympathetic and parasympathetic nervous systems in the regulation of heart rate.\nMaximum 3 marks", "er": "This question had a mean mark of just under 2. 2 marks were awarded to around 68% of students. They correctly identified that the sympathetic nervous system was responsible for increasing heart rate and the parasympathetic system for slowing it down. The remaining students were evenly split above and below this mark point. Several students referred to receptors which were not relevant to the question. Others went beyond the required description, attempting to explain how these systems work, which was not required. Those students who accessed the third mark generally did so by naming the nerves involved.", "type": "written"},
  {"id": "EP11", "sub": "Energy Systems", "q": "An amateur boxing match consists of three rounds. Each round lasts 3 minutes.\nThere is a 1-minute break between each round.\nAnalyse the role of excess post-exercise oxygen consumption (EPOC) during the match and its impact on the performance of the boxer as the rounds progress.", "marks": 3, "ao": "AO3", "ms": "• EPOC will occur during breaks to repay oxygen debt/as they have worked anaerobically. (1)\n• (Fast/alactic component) Some ATP/PC will be resynthesised allowing the boxer to perform explosively/anaerobically/at high intensity in subsequent rounds. (1)\n• PC stores will not be fully resynthesised resulting in the increased use of the anaerobic glycolytic system/production of lactic acid/fatigue. (1)\n• Some re-saturation of myoglobin with oxygen will delay the build-up of lactic acid/fatigue. (1)\n• (Slow/lactic component) Not enough time/oxygen to remove lactic acid so it will build up causing fatigue/decreased performance. (1)\nAccept any other appropriate analysis of the role of excess post-exercise oxygen consumption during the match and its impact on the performance of the boxer as the rounds progress.\nMaximum 3 marks", "er": "This question had a mean mark of around 0.5 reflecting how difficult students found it. Less than 1% of students were awarded 3 marks and just under 10% 2 marks. This is despite student presenting good AO1 knowledge about what EPOC is and its component parts, none of which was creditworthy. The challenge of this question was twofold. Firstly, as has traditionally been the case, student's answers lacked the depth required to gain a mark, missing off the impact on the boxer's performance. For example, many students knew that in the one-minute breaks some PC stores would be replenished but failed to go on to explain that this would allow the boxer to continue to produce explosive punches at the start of the next round. Secondly this is a new context in which EPOC has been examined. Hopefully this will provide a basis for teachers to develop students understanding of the role of EPOC in longer duration exercise which is not continuous in nature.", "type": "written"},
  {"id": "EP12", "sub": "Neuromuscular & Fibre Types", "q": "Which one of the following describes spatial summation?\nA) A motor unit being capable of fully contracting or not contracting at all\nB) A sustained, smooth muscular contraction\nC) Repeated nerve impulses allowing no time for the muscle fibres to relax\nD) The addition of impulses received at different places on the neuron", "marks": 1, "ao": "AO1", "ms": "D – The addition of impulses received at different places on the neuron", "er": "Students found this question (mean approx. 0.44) challenging to a degree. Both options B and C were common incorrect answers which show lack of core knowledge of how muscle fibres are recruited. This has been a weakness in previous assessments.", "type": "mcq", "answer": "D"},
  {"id": "EP13", "sub": "Data & Testing", "q": "Measuring energy expenditure can be useful during training.\nWhich one of the following would be most practical to use with a swimmer during a training session in the pool?\nA) Direct gas analysis VO2 max test\nB) Indirect calorimetry\nC) Lactate sampling", "marks": 1, "ao": "AO2", "ms": "C – Lactate sampling", "er": "Students found this question (mean approx. 0.52) challenging to a degree. Both possible alternatives were commonly given as incorrect responses which show an inability to apply knowledge of measuring energy expenditure to specific scenarios.", "type": "mcq", "answer": "C"},
  {"id": "EP14", "sub": "Respiratory System", "q": "Describe how an increase in carbon dioxide in the blood during exercise would lead to an increased breathing rate.", "marks": 3, "ao": "AO1", "ms": "• Increased blood acidity/decreased blood pH. (1)\n• Detected by chemoreceptors. (1)\n• Impulse sent to the respiratory centre/medulla. (1)\n• Increased impulses to respiratory muscles to contract faster. (1)\nAccept named respiratory muscles including diaphragm/intercostal muscles/scalene/ sternocleidomastoid/pectorals/abdominals.\nAccept any other appropriate description of how an increase in carbon dioxide in the blood during exercise would lead to an increased breathing rate.\nMax 3 marks", "er": "This was a 3-mark AO1 question which had a mean mark around 1. Where students were successful, they were generally able to pick up marks for the first three marking points. Very few students, however, were able to correctly identify that breathing rate was increased due to faster contraction of the respiratory muscles. There appeared to be an element of rote learning to this topic as students frequently referenced the impact on the heart which had no relevance to the question set.", "type": "written"},
  {"id": "EP15", "sub": "Movement Analysis", "q": "The diagram shows an athlete performing the downward phase of a press-up.\n\nFor the movement at the elbow as the athlete moves from position A to position B, give:\n• the articulating bones at the elbow\n• the main agonist\n• the plane\n• the axis", "marks": 4, "ao": "AO1/AO2", "ms": "Articulating bones at the elbow: Humerus, radius and ulna — all three required for the mark (1)\nMain agonist: Triceps (1)\nPlane: Sagittal (1)\nAxis: Transverse (1)\nMax 4 marks", "er": "This was a 4-mark question combining AO1 and AO2. The mean mark was approximately 2. The AO1 aspect of the question was poorly answered given its simplicity, with a high number of students unable to name the three articulating bones at the elbow. Knowledge of articulating bones is a clear requirement of the specification but may have less time spent on it given its relative ease. Students' performance on the AO2 aspects was more in line with expectations. Where students failed to identify the main agonist the most common answer was biceps. This highlights a common failure to understand the changes which occur during eccentric contractions. Students commonly find planes and axis challenging but it was disappointing to see the number who couldn't identify a correct pair, given that these are constant. It was also a concern that a number of students simply put the same term down for both, hedging their bets, but clearly not having considered what the correct answer may be.", "type": "written", "img": "pressup_down"},
  {"id": "EP16", "sub": "Cardiovascular System", "q": "If endurance events take place in warm conditions, cardiovascular drift can occur.\nAnalyse how cardiovascular drift may result in lower levels of performance.", "marks": 3, "ao": "AO3", "ms": "• Athletes will sweat reducing the plasma volume of blood. (1)\n• Blood becomes more viscous/thicker which reduces venous return. (1)\n• Due to Starling's law stroke volume/ejection fraction will decrease. (1)\n• As stroke volume/ejection fraction decreases heart rate increases to maintain/increase cardiac output. (1)\n• Having a higher heart rate at a lower than normal intensity increases the athlete's rate of perceived effort/the performer mentally thinks they are working harder than they are. (1)\nAccept any other appropriate analysis of how cardiovascular drift may result in lower levels of performance.\nMax 3 marks", "er": "This was a 3-mark AO3 question. The mean mark was around 0.5 which reflected the high number of candidates who failed to attempt the question (approximately 6%) or scored 0 (approximately 58%). While students were sometimes able to demonstrate knowledge of cardiovascular drift, they failed to go into the detail required from an AO3 question, signposted by the command word analyse. The question required students to show linking between cause and effect; breaking down the concept of cardiovascular drift to suggest the causes of the physiological changes which would occur, and ultimately the impact they would have on performance.", "type": "written"},
  {"id": "EP17", "sub": "Movement Analysis", "q": "Which one of the following muscles is a main agonist when flexion occurs at the shoulder?\nA) Anterior deltoid\nB) Medial deltoid\nC) Posterior deltoid", "marks": 1, "ao": "AO1", "ms": "A – Anterior deltoid", "er": "", "type": "mcq", "answer": "A"},
  {"id": "EP18", "sub": "Energy Systems", "q": "Which one of the following is a direct product of beta oxidation?\nA) Acetyl-CoA\nB) Carbon dioxide\nC) Citric acid\nD) Oxaloacetate", "marks": 1, "ao": "AO1", "ms": "A – Acetyl-CoA", "er": "", "type": "mcq", "answer": "A"},
  {"id": "EP19", "sub": "Respiratory System", "q": "The graph below shows a spirometer trace.\nDefine the term 'tidal volume'.", "marks": 1, "ao": "AO1", "ms": "• The volume of air breathed in or out per breath (1)\nDo not accept in and out.\nAccept any other appropriate definition of tidal volume.\nMax 1 mark", "er": "", "type": "written", "img": "spiro"},
  {"id": "EP20", "sub": "Respiratory System", "q": "The graph below shows a spirometer trace.\nExplain how and why a period of continuous exercise would impact the lung volumes in the graph above.\nTidal volume\nExpiratory reserve volume\nResidual volume", "marks": 3, "ao": "AO2", "ms": "• (Tidal volume) would increase as performer needs more oxygen to working muscles (1)\n• (Expiratory reserve volume) decreases due to the increase in tidal volume (1)\n• (Residual volume) will stay the same as if it decreased the lungs would be at risk of collapse/not affected by continuous exercise (1)\nAccept any other appropriate explanation of how and why a period of continuous exercise would impact the lung volumes in the graph.\nMax 3 marks", "er": "", "type": "written", "img": "spiro"},
  {"id": "EP21", "sub": "Cardiovascular System", "q": "Explain the role of the atrioventricular node in the cardiac conduction system.", "marks": 3, "ao": "AO1", "ms": "• Receives impulse from sinoatrial node/SAN (1)\n• Delays (transmission of) impulse (1)\n• To allow ventricular filling/enable the atria to fully contract (1)\n• Sends impulse down septum/through bundle of His/to purkinje fibres (1)\nAccept any other appropriate explanation of the role of the atrioventricular node in the cardiac conduction system.\nMax 3 marks", "er": "", "type": "written"},
  {"id": "EP22", "sub": "Cardiovascular System", "q": "Training can increase an athlete's maximum A-VO2 diff.\nAnalyse how the body systems adapt to allow this.", "marks": 3, "ao": "AO3", "ms": "• Increased oxygen content in arterial blood due to more red blood cells/haemoglobin/oxygen carrying capacity of the blood (1)\n• Increased gas exchange at the muscle due to increased capillarisation/increases blood supply/surface area (1)\n• Increased gas exchange at the muscle due to more myoglobin which has a greater affinity for oxygen than haemoglobin so pulls more oxygen into muscle/can store more oxygen in muscle (1)\n• Increased gas exchange at the muscle due to larger/more numerous/more efficient mitochondria allowing for more oxygen to be used in a muscle cell so less returned to venous blood (1)\nReference to gas exchange at the muscle only required once for 2nd, 3rd and 4th bullet points.\nAccept any other appropriate analysis of how the body systems adapt as a result of training to increase maximum A-VO2 diff.\nMax 3 marks", "er": "", "type": "written"},
  {"id": "EP23", "sub": "Movement Analysis", "q": "The figure below shows a squat action.\nIdentify the main agonist causing extension at the knee joint between Position A and Position B.\nA) Gastrocnemius\nB) Gluteals\nC) Hamstrings\nD) Quadriceps", "marks": 1, "ao": "AO2", "ms": "D – Quadriceps", "er": "", "type": "mcq", "answer": "D", "img": "squat_knee"},
  {"id": "EP24", "sub": "Cardiovascular System", "q": "Define A-VO2 diff.", "marks": 1, "ao": "AO1", "ms": "Award maximum one mark for any of the following:\n• Difference between oxygen content of arterial and venous blood (1)\n• Difference in oxygen content of arterial and venous blood leaving and returning to the heart (1)", "er": "", "type": "written"},
  {"id": "EP25", "sub": "Cardiovascular System", "q": "Describe how cardiovascular drift can occur after 10 minutes of steady state exercise in a warm environment.", "marks": 3, "ao": "AO1", "ms": "• An individual will sweat/lose some fluid/water (1)\n• Some blood can be redirected to the skin for heat loss (1)\n• Increase viscosity of blood/decrease in blood plasma volume (1)\n• Can lead to a reduction in venous return (1)\n• Leads to reduced stroke volume (1)\n• Starling's Law referenced in correct context (1)\n• Heart rate will increase to maintain cardiac output (1)\nAccept any other appropriate description of how cardiovascular drift can occur after 10 minutes of steady state exercise in a warm environment.", "er": "", "type": "written"},
  {"id": "EP26", "sub": "Neuromuscular & Fibre Types", "q": "State two structural characteristics of fast glycolytic muscle fibres (type IIx).", "marks": 2, "ao": "AO1", "ms": "• Large motor neurone size (1)\n• Mitochondrial density is low (1)\n• Myoglobin content is low (1)\n• Capillary density is low (1)\n• High amount of anaerobic enzymes/myosin ATPase (1)\nAccept any other relevant structural characteristic of fast glycolytic muscle fibres.", "er": "", "type": "written"},
  {"id": "EP27", "sub": "Neuromuscular & Fibre Types", "q": "Explain how two functional characteristics of fast glycolytic muscle fibres will support an athlete during a 100 metre race.", "marks": 2, "ao": "AO2", "ms": "• Speed of conduction/contraction, eg will allow the athlete to generate a fast start (1)\n• High levels of force generated, eg will allow the athlete to push out against the blocks at the start of the race with more force/will allow the athlete to increase maximal speed by applying a greater force to the ground or blocks (1)\n• High anaerobic capacity, eg will allow the athlete to maintain force production throughout the race to achieve maximal speed/maintain momentum throughout the 100 metres (1)\n• High glycolytic enzyme activity, eg will support quicker/prolonged anaerobic ATP resynthesis/production during the race/allowing the athlete to maintain momentum at higher intensities during the race (1)\nCandidates must both state a functional characteristic and how it will support an athlete during a 100 metre race.\nAccept any other appropriate explanation for how functional characteristics of fast glycolytic muscle fibres will support an athlete during a 100 metre race.", "er": "", "type": "written"},
  {"id": "EP28", "sub": "Data & Testing", "q": "Respiratory Exchange Ratio (RER) is a method for measuring the energy expenditure of an athlete.\nThe RER values of three performers are:\nPerformer 1: 1.00\nPerformer 2: 0.70\nPerformer 3: 0.85\n\nWhich of these performers is using fat as their main energy source?\nA) Performer 1\nB) Performer 2\nC) Performer 3", "marks": 1, "ao": "AO2", "ms": "B – Performer 2", "er": "", "type": "mcq", "answer": "B"},
  {"id": "EP29", "sub": "Energy Systems", "q": "Runners in the London Marathon will mainly use the aerobic energy system during their race.\nName and describe the three key processes involved in the aerobic energy system when using glucose as an energy source.", "marks": 3, "ao": "AO1", "ms": "• Glycolysis - glucose broken down into pyruvate/pyruvic acid (1)\n• Krebs/citric acid cycle - oxidation of acetyl-coenzyme-A/citric acid (1)\n• Electron transport chain - transfer of electrons down a carrier chain/hydrogen is oxidised (1)\nAccept first three only. Must have name and description. Answers can appear in any order. Do not accept beta oxidation.\nAccept any other appropriate name and description of the three processes.", "er": "", "type": "written"},
  {"id": "EP30", "sub": "Respiratory System", "q": "Runners in the London Marathon will mainly use the aerobic energy system during their race.\nState one long-term effect of smoking regularly on the structures of a runner's respiratory system.", "marks": 1, "ao": "AO1", "ms": "• Carbon monoxide binds to haemoglobin in the lungs rather than oxygen (1) \n• Constricts the bronchioles (1)\n• Damaged cilia (1)\n• Reduction in number/damaged alveoli (1)\nEffects must be long term and relate specifically to the structures of the respiratory system.\nAccept any other appropriate long-term effect of smoking regularly on the structures of the runner's respiratory system.", "er": "", "type": "written"},
  {"id": "EP31", "sub": "Respiratory System", "q": "Runners in the London Marathon will mainly use the aerobic energy system during their race.\nExplain how smoking regularly would impact the performance of the runners in the marathon.", "marks": 2, "ao": "AO2", "ms": "• Reduced gaseous exchange in the lungs/oxygen transport to the muscles (1)\n• This decreases the athlete's ability to utilise oxygen in energy production/work aerobically (1)\n• This means they have less energy for their activity/slower time/fatigue quicker (due to working anaerobically) (1)\nAccept other explanations of the impact on performance of the runners in the marathon.", "er": "", "type": "written"},
  {"id": "EP32", "sub": "Health & Exercise", "q": "Describe how heart disease can result in a heart attack.", "marks": 2, "ao": "AO1", "ms": "• Hardening of coronary arteries/build-up of plaque/cholesterol/fat in the coronary arteries/atherosclerosis/arteriosclerosis (1)\n• Causes blockage/blood clot (1)\n• Limiting the supply of oxygen to the heart/angina (1)\nAccept any other appropriate description of how heart disease can result in a heart attack.", "er": "", "type": "written"},
  {"id": "EP33", "sub": "Health & Exercise", "q": "Outline two ways an active lifestyle can reduce the risk of heart disease.", "marks": 2, "ao": "AO1", "ms": "• Decrease in cholesterol/LDL/fat in coronary arteries (1)\n• Lower blood pressure (1)\n• Stronger heart/cardiac hypertrophy/higher stroke volume (1)\nDo not accept decrease in HDL.\nAccept first two answers only.\nAccept any other appropriate outline of how an active lifestyle can reduce the risk of heart disease.", "er": "", "type": "written"},
  {"id": "EP34", "sub": "Neuromuscular & Fibre Types", "q": "Which type of summation is shown in the graph below?\nA) Spatial\nB) Tetanic\nC) Wave", "marks": 1, "ao": "AO2", "ms": "C – Wave", "er": "This question provided good differentiation. 65% of students correctly answered this question.", "type": "mcq", "answer": "C", "img": "summation"},
  {"id": "EP35", "sub": "Movement Analysis", "q": "The figure below shows an athlete performing the shot put.\nIdentify the plane and axis of motion for the action occurring at the elbow joint from position A to position B.\nA) Frontal plane / Sagittal axis\nB) Frontal plane / Transverse axis\nC) Sagittal plane / Transverse axis\nD) Transverse plane / Longitudinal axis", "marks": 1, "ao": "AO2", "ms": "C – Sagittal plane / Transverse axis", "er": "This question provided good differentiation. 60% of students answered correctly. It was pleasing to see students correctly applying planes and axis of motion within this question, which is often a topic area that students find challenging.", "type": "mcq", "answer": "C", "img": "shotput"},
  {"id": "EP36", "sub": "Respiratory System", "q": "The table shows tidal volumes and respiratory rates when exercising at different intensities.\n\nIntensity | Tidal volume (L) | Respiratory rate (breaths/min)\nLow | 1 | 17\nMedium | 2 | 30\nHigh | 2.4 | 35\n\nCalculate minute ventilation during medium intensity exercise.", "marks": 2, "ao": "AO2", "ms": "Two marks for the correct answer with correct units: 60 l/min (2)\nOne mark for correct workings or correct answer without units: Respiratory Rate x Tidal Volume / 30 x 2 / 60 (1)", "er": "This was generally answered well, with 87% of students gaining at least 1 mark for identifying the correct answer. However, only 40% of students gained the second mark for correctly identifying the units.", "type": "written"},
  {"id": "EP37", "sub": "Cardiovascular System", "q": "Describe how the body redistributes blood to the skeletal muscles during exercise.", "marks": 4, "ao": "AO1", "ms": "Award one mark for any of the following points.\n• Chemoreceptors / baroreceptors / proprioceptors detect changes (change in blood pressure, change in movement, change in acidity of blood) due to exercise (1)\n• Vasomotor centre / medulla oblongata controls the blood flow (1)\n• (At nonessential organs) increased sympathetic nervous impulses / (Pre-capillary) sphincters contract / close / cause vasoconstriction (1)\n• (At the working muscles) decreased sympathetic nervous impulses / (Pre-capillary) sphincters relax / open / cause vasodilation (1)\n• Vasoconstriction occurs to nonessential organs / vasodilation occurs to working muscles (1)\nAccept any other appropriate descriptions of how the body redistributes blood to the skeletal muscles during exercise.", "er": "The mean mark for this question was 1.04 and responses showed varying degrees of knowledge, understanding and clarity. This was a challenging question that considered how the body redistributes blood to the skeletal muscles during exercise. Some students did not understand the concept of redistribution of blood and therefore their responses lacked any reference to topic specific language or coherent descriptions. In contrast, some students had a very detailed knowledge of redistribution of blood, with 14% achieving 3 or 4 marks. The main reason why 39% of students only achieved 1 mark is that they only referred to vasoconstriction and vasodilation of blood vessels. Students needed to demonstrate a more detailed knowledge of this topic area, beyond that of GCSE. Students scored higher marks if they described the vasomotor centre controlling blood flow via the sympathetic nerve pathways, alongside the role of the pre-capillary sphincters.", "type": "written"},
  {"id": "EP38", "sub": "Flexibility & Stretching", "q": "(a) Explain the role of muscle spindles and Golgi tendon organs in proprioceptive neuromuscular facilitation (PNF).\n(4)\n(b) The picture below shows a 110 m hurdles race.\nSuggest how PNF could improve the performance of the hurdler.\n(2)", "marks": 6, "ao": "AO1/AO3", "ms": "(a) Sub-max 3 The muscle spindles:\n• Detect an increase in muscle length / how far / fast a muscle is stretched (1)\n• Send a message to the nervous system (1)\n• During PNF the muscle spindles will initiate a stretch reflex / muscle contraction (1)\n• This can prevent over stretching (1)\nSub-max 3 Golgi-tendon organs:\n• Detect increased tension in a muscle (1)\n• Send inhibitory signals / autogenic inhibition / override stretch reflex (1)\n• Cause muscle to relax (1)\nAccept any other appropriate explanation of the role of muscle spindles and Golgi tendon organs in proprioceptive neuromuscular facilitation (PNF).\n(b)\n• The hurdlers improved range of movement / flexibility would allow them to clear the hurdles with more ease (1)\n• The hurdlers increased range of motion / flexibility would allow them to improve stride length, generating more power / velocity (1)\n• The hurdlers increased range of motion / flexibility would support the hurdler to generate a more fluid / efficient stride pattern (1)\n• PNF may help to minimise the risk of injury, allowing them to continue training and performing (1)\nDo not credit jumping higher.\nAccept any other appropriate suggestions for how PNF stretching could improve the performance of the 110m hurdler.", "er": "(a) This question produced a good range of marks awarded and provided good discrimination. The mean mark for this question was 1.6 and 30% of students gained 3 or 4 marks. Some students did not decode the question successfully and gave a description of how an athlete may perform PNF stretching, sometimes with a partner, rather than specifically focusing upon the role of the muscle spindles and Golgi tendon organs during PNF. There were some outstanding responses seen and some superb knowledge applied by some students. (b) This question was found challenging and only 3% of students achieved the full 2 marks. Most of the 65% of students who gained 1 mark, identified that PNF could increase flexibility / ROM and that this would make it easier / more efficient for the hurdler to lift a leg to clear the hurdle. Any other identified impact needed a reference to improving the performance of the hurdler. If students identified that PNF stretching may reduce risk of injury, the student needed to suggest how this would improve performance, i.e. allowing the athlete to continue training / performing.", "type": "written", "img": "hurdles"},
  {"id": "EP39", "sub": "Movement Analysis", "q": "Which one of these muscles causes horizontal abduction at the hip?\nA) Abdominals\nB) Gluteus Minimus\nC) Hamstrings\nD) Iliopsoas", "marks": 1, "ao": "AO2", "ms": "B – Gluteus Minimus", "er": "This question was the lowest scoring of the multiple-choice questions on the paper with around 59% of students correctly identifying gluteus minimus as the muscle which causes horizontal abduction at the hip. This highlights the importance of students developing an understanding of the working muscles across all the joints and movements specified and especially those relating to abduction and adduction of the hip, and horizontal abduction and adduction of the hip and shoulder which are not required at GCSE.", "type": "mcq", "answer": "B"},
  {"id": "EP40", "sub": "Respiratory System", "q": "How does exercise affect the lung volumes labelled X and Y in the graph below.\nA) X: Decreases Y: Decreases\nB) X: Decreases Y: Stays the same\nC) X: Stays the same Y: Decreases\nD) X: Stays the same Y: Stays the same", "marks": 1, "ao": "AO2", "ms": "B – X: Decreases Y: Stays the same", "er": "This question was answered correctly by around 76% of students who were able to apply their knowledge of spirometers to the graph shown in the question.", "type": "mcq", "answer": "B", "img": "spiro_xy"},
  {"id": "EP41", "sub": "Health & Exercise", "q": "State one positive effect that high density lipoproteins have on the body.", "marks": 1, "ao": "AO1", "ms": "• Remove excess cholesterol (1)\n• Transport excess cholesterol to the liver (1)\n• Protect the artery walls against LDL cholesterol / an anti-inflammatory effect (1)\n• Help protect blood cells and important chemical messengers in the blood from being broken down by the liver / positive anti-oxidant effect (1)\n• Reduce the risk of heart disease (1)\nAccept first answer only.\nAccept any other positive effect that high density lipoproteins have on the body.", "er": "Despite being set as a lower demand AO1 question, only about 41% of students were able to state a positive effect of high density lipoproteins. A number of students made statements regarding muscle growth and energy production. As stated in the specification, it is important that students understand the effect that cholesterol (both HDL and LDL) can have on a person's health.", "type": "written"},
  {"id": "EP42", "sub": "Training & Fitness", "q": "High Intensity Interval Training (HIIT) involves alternating short periods of intense exercise with lower intensity periods of recovery.\nDiscuss the effectiveness of HIIT as a training method for a games player.", "marks": 4, "ao": "AO3", "ms": "For (sub max 3)\n• Works anaerobic energy system required in games with applied example / aerobic energy system required in games with applied example (1)\n• Mixture of high intensity / anaerobic energy system and low intensity / aerobic energy system mimics the demands of a game (1)\n• Work:rest ratio can be altered to meet specific demands of sport/position (1)\n• Can improve a range of components of fitness required in team games / (2 or more named components of fitness applied to games player) e.g. aerobic endurance, anaerobic power, speed, muscular endurance (1)\n• Develops the performers ability to perform sports specific skills under fatigue / buffer lactic acid with applied example (1)\n• Potentially more effective at increasing aerobic endurance than continuous training / takes less time than continuous training to improve aerobic power (1)\nAgainst (sub max 3)\n• Not most appropriate for all positions / other training methods may be more appropriate for certain positions or games e.g. goalkeeper in football or weight training for rugby player (1)\n• High intensity increases risk of injury / means that longer rest intervals required between sessions so can't perform multiple sessions (1)\n• Intensity can negatively impact on skill performance (1)\n• Work:rest intervals differ by position and sports / can be difficult to accurately work out (1)\nAccept any other appropriate evaluation of the effectiveness of HIIT as a training method.\nAnswers must relate to games players.", "er": "As in the previous series, students did not always respond appropriately to the command word 'discuss'. This requires students to give both sides of an argument and should signpost them toward using more complex thinking skills to ensure that any knowledge they have regarding strengths and weaknesses is specifically applied to the situation or activity in the question. The mean mark of just over 1 reflects students' inability to do this effectively in this question. Less than 5% of students achieved more than 2 marks, which represents the lack of detail which was evident in students' answers for a 4-mark AO3 question.", "type": "written"},
  {"id": "EP43", "sub": "Respiratory System", "q": "Describe the process of gas exchange which occurs at a muscle.", "marks": 3, "ao": "AO1", "ms": "• Oxygen diffuses from the capillary to the muscle cells and carbon dioxide diffuses from the muscle cells to the capillary (1)\n• Oxygen / carbon dioxide moves from areas of high concentration/partial pressure to areas of low concentration / partial pressure (1)\n• Myoglobin transports and stores oxygen in the muscle / has a higher affinity to oxygen then haemoglobin / pulls more oxygen in to the muscle (1)\nAccept any other appropriate description of how gas exchange occurs at a muscle.", "er": "This question awarded 3 marks for 3 different points. These 3 points were for identifying the direction in which both gases move, showing an understanding of how partial pressure causes this to happen and explaining the role of myoglobin in the movement of gases at a muscle. Around 42% of students achieved 2 marks but only about 6% achieved 3. This was mainly due to students failing to identify the important role that myoglobin plays in gas exchange at a muscle.", "type": "written"},
  {"id": "EP44", "sub": "Respiratory System", "q": "Gas exchange at the muscle will change during exercise as the Bohr shift will occur.\nDescribe the Bohr shift.", "marks": 2, "ao": "AO1", "ms": "• Occurs as a result of increased CO2 in the blood / increased blood acidity / decreased blood pH / increased temperature (1)\n• Increase in hydrogen ions (1)\n• Bohr shift is when an oxyhaemoglobin disassociation curve moves to the right (1)\n• Haemoglobin has a lower affinity for oxygen at working muscles / gives up oxygen more easily / at higher partial pressures (1)\nAccept any other appropriate explanation of Bohr Shift and its impact on performance.", "er": "", "type": "written"},
  {"id": "EP45", "sub": "Training & Fitness", "q": "Which one of these is a fitness benefit of regular participation in low intensity continuous training, such as jogging?\nA) Decreased risk of heart disease\nB) Increased aerobic endurance\nC) Increased flexibility\nD) Increased levels of serotonin", "marks": 1, "ao": "AO1", "ms": "B – Increased aerobic endurance", "er": "This question was well answered by students. This demonstrates that the difference between fitness and other benefits was generally well understood.", "type": "mcq", "answer": "B"},
  {"id": "EP46", "sub": "Movement Analysis", "q": "The diagram below shows horizontal adduction at the shoulder joint from position X to position Y.\nIdentify the plane and axis of motion for the action occurring at the shoulder joint from position X to position Y.\nA) Frontal plane / Sagittal axis\nB) Frontal plane / Transverse axis\nC) Sagittal plane / Transverse axis\nD) Transverse plane / Longitudinal axis", "marks": 1, "ao": "AO2", "ms": "D – Transverse plane / Longitudinal axis", "er": "This question provided a good challenge with approximately only a quarter of students identifying the correct plane and axis of motion.", "type": "mcq", "answer": "D", "img": "pressup_hadd"},
  {"id": "EP47", "sub": "Respiratory System", "q": "Which one of these statements defines expiratory reserve volume?\nA) Volume of air inspired and expired per breath.\nB) Volume of air inspired and expired per minute.\nC) Volume of air that can be forcibly expired after a normal breath.\nD) Volume of air that remains in the lungs after expiration.", "marks": 1, "ao": "AO1", "ms": "C – Volume of air that can be forcibly expired after a normal breath.", "er": "Although challenging this question was answered very well with approximately two thirds of students correctly identifying the definition for expiratory reserve volume.", "type": "mcq", "answer": "C"},
  {"id": "EP48", "sub": "Flexibility & Stretching", "q": "Proprioceptive Neuromuscular Facilitation (PNF) is a form of stretching that can increase flexibility.\nExplain the role of golgi tendon organs during PNF.", "marks": 2, "ao": "AO2", "ms": "Golgi-tendon organs detect the tension in the muscle (created during the isometric contraction Phase) (1).\nGolgi-tendon organs send inhibitory signals / autogenic inhibition (1).\nDelays the stretch reflex (1).\nAllowing for greater range of movement (1).\nMax 2 marks", "er": "This question proved difficult for students, with few getting full marks. Answers were often too vague.", "type": "written"},
  {"id": "EP49", "sub": "Cardiovascular System", "q": "When starting to exercise venous return will increase. This will result in more blood returning to the right-hand side of the heart.\nDescribe three mechanisms that support venous return.", "marks": 3, "ao": "AO1", "ms": "Award one mark for any of the following points.\n((Skeletal) muscle pump) - increased contraction of muscles press nearby veins (to squeeze blood back to the heart) (1).\n(Respiratory pump) - increased breathing rate will alter / change pressure in thoracic cavities / area to (assist blood flow back to the heart) (1).\n(Suction pump of heart) - more blood pumped out of the heart, so more blood then drawn / forced back (1).\nPocket valves - (located in veins), stop backflow (by closing) and help shunt blood back to heart (1). Smooth muscle - located in the walls of the veins / involuntary muscle contraction (help to squeeze blood back to heart) (1).\nNB; Description must be present - no marks for just naming mechanisms.\nAccept other appropriate descriptions of venous return mechanisms.\nMax 3 marks", "er": "Many students were able to access some marks, although many missed marks because of a lack of clarity in their descriptions of identified mechanisms. Knowledge needs to be accurately described. For example, it is not the muscle pump that contracts, but the skeletal muscles that contract, which compress nearby veins, squeezing the blood back to the heart.", "type": "written"},
  {"id": "EP50", "sub": "Cardiovascular System", "q": "Describe how the cardiac conduction system causes the heart to contract.", "marks": 3, "ao": "AO1", "ms": "Award one mark for each of the following points.\n• The sino-atrial node (SAN) (the pace maker of the heart) sends an impulse/electrical signal through the walls of the atria (1)\n• Spreads as a wave of excitation (1)\n• This causes atrial systole / atria contract (1)\n• The impulse then passes to the atrio-ventricular node (AVN), (which delays the impulse (for around 0.1 seconds, enabling atria to fully empty) (1)\n• The impulse passes down the Bundle of His (in the septum of the heart), to the Purkinje fibres in the (walls of) the ventricles (1)\n• Ventricular systole then occurs / ventricles contract (1).\nStudents must refer to the system in order.\nAccept other appropriate descriptions of how the cardiac conduction system causes the heart to contract.\nMax 3 marks", "er": "This question created good differentiation with just under half of students gaining 2 or 3 marks. It was clear that some students had a very good knowledge of the cardiac conduction system and had applied it to the heart, whereas others had included irrelevant theory or produced very muddled responses with no clarity or coherence. Some students just listed structural features and did not say how this causes the heart to contract. The better answers referenced the generation and flow of the impulse, alongside the effect this had on causing atria and ventricles to contract.", "type": "written"},
  {"id": "EP51", "sub": "Cardiovascular System", "q": "The table represents heart rate and stroke volume for an untrained performer as intensity of exercise increases.\n\nPoint | Heart rate (bpm) | Stroke volume (ml)\nA (rest) | 70 | 85\nB | 90 | 90\nC | 100 | 95\nD | 120 | 100\n\nCalculate cardiac output for the untrained performer at point D in the table.", "marks": 2, "ao": "AO2", "ms": "Award one mark for correct calculation and one mark for use of units.\nUntrained =\n• Cardiac output = 120 x 100\n• = 12000 ml / min / 12 L / min.\nNB; Award two marks for the correct answer with no working.\nDo not credit heart rate x stroke volume only.\nMax 2 marks", "er": "Most students were familiar with the formula and were able to make the calculation, but only a quarter of students gained full marks for using the correct units.", "type": "written"},
  {"id": "EP52", "sub": "Cardiovascular System", "q": "The table represents heart rate and stroke volume for an untrained performer as intensity of exercise increases.\n\nPoint | Heart rate (bpm) | Stroke volume (ml)\nA (rest) | 70 | 85\nB | 90 | 90\nC | 100 | 95\nD | 120 | 100\n\nExplain how and why the components of cardiac output differ for a trained performer at point A.", "marks": 3, "ao": "AO2", "ms": "• Trained athlete would have a lower resting heart rate of below 60 bpm / bradycardia (1)\n• The trained athlete has a higher resting stroke volume (more blood ejected per beat) (1)\n• Regular training of trained performer leads to cardiac hypertrophy (1)\n• This means a trained performer will have stronger heart / more forceful contraction (1).\nMax 3 marks", "er": "This question created a good range of marks with a fairly even percentage of students being awarded 1, 2 and 3 marks. Those students awarded 3 marks were explaining the how and why of any identified points with more detail.", "type": "written"},
  {"id": "EP53", "sub": "Cardiovascular System", "q": "Which receptor is responsible for detecting a change in blood pressure?\nA) Baroreceptor\nB) Chemoreceptor\nC) Proprioceptor", "marks": 1, "ao": "AO1", "ms": "A – Baroreceptor", "er": "97% of students correctly identified the baroreceptor as the receptor responsible for detecting a change in blood pressure.", "type": "mcq", "answer": "A"},
  {"id": "EP54", "sub": "Data & Testing", "q": "Which method of estimating energy expenditure involves measuring the production of CO2 and / or the consumption of O2?\nA) Indirect calorimetry\nB) Lactate sampling\nC) VO2 max test", "marks": 1, "ao": "AO1", "ms": "A – Indirect calorimetry", "er": "Only 61% of students correctly identified indirect calorimetry as the method that measures CO2 production and/or O2 consumption. Those who did not get the mark most often confused the correct answer with a VO2 max test.", "type": "mcq", "answer": "A"},
  {"id": "EP55", "sub": "Cardiovascular System", "q": "The table shows the oxygen content of arterial and venous blood at rest and during intense aerobic exercise.\n\n(ml O2 / 100 ml blood) | Arterial blood | Venous blood\nRest | 20 | 15\nIntense aerobic exercise | 20 | 5\n\nDefine the term A-VO2 diff.", "marks": 1, "ao": "AO1", "ms": "• Difference between oxygen content / partial pressure of oxygen in arterial and venous blood (1)\n• How much O2 is extracted and used by muscles (1).\nAccept other appropriate definitions of the term A-VO2 diff.\nMax 1 mark", "er": "70% of students achieve the mark for this question. Where students failed to answer the question correctly it was most often due to failing to refer to oxygen in their answer.", "type": "written"},
