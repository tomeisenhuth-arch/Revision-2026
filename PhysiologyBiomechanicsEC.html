  {"id": "EP56", "sub": "Cardiovascular System", "q": "Explain the change in A-VO2 diff during exercise. Use the data in the table in your answer.\n\n(ml O2 / 100 ml blood) | Arterial blood | Venous blood\nRest | 20 | 15\nIntense aerobic exercise | 20 | 5", "marks": 3, "ao": "AO2", "ms": "Award one mark for each of the following up to a maximum of three marks.\n• A-VO2 diff increases from 5 to 15ml\n• Means more oxygen is needed / extracted by the muscles\n• Used / needed for energy / ATP production for endurance / stamina / aerobic exercise / delays fatigue.\nAccept other appropriate explanations of the change in A-VO2 diff during exercise. Answers must relate to the table.\nMax 3 marks", "er": "The mean mark for this question was 1.6 with most students able to explain that more oxygen was required by the working muscles and some highlighting that this was required for energy / ATP production. Fewer students were awarded the mark for the main focus of the question, which was stating that AVO2 diff increases and supporting this statement with information from the table. This highlights the need for students to carefully read and answer the question set.", "type": "written"},
  {"id": "EP57", "sub": "Movement Analysis", "q": "The diagram below shows a tennis player performing a forehand stroke.\nIdentify the main agonist, and plane and axis of movement at the right shoulder as the tennis player in the diagram above moves from position A to position B.\nAgonist:\nPlane:\nAxis:", "marks": 3, "ao": "AO2", "ms": "Award one mark for each of the following points.\nAgonist: Pectorals / anterior deltoid.\nPlane: Transverse plane.\nAxis: Longitudinal axis.\nMax 3 marks", "er": "Over a quarter of students were able to access the full 3 marks for this question. Where full marks were not awarded, common errors included naming the main agonist as the deltoid and stating that the movement occurred in the sagittal plane around the transverse axis.", "type": "written", "img": "tennis_sh"},
  {"id": "EP58", "sub": "Neuromuscular & Fibre Types", "q": "In the diagram below, the main muscle fibre type used for a powerful forehand stroke is fast glycolytic (type IIx).\nState three characteristics of this muscle fibre type.", "marks": 3, "ao": "AO1", "ms": "Accept first three answers only.\nAward one mark for each of the following up to a maximum of three marks.\n• Large motor neurone size\n• Large muscle fibre diameter\n• More sarcoplasmic reticulum development\n• High PC stores\n• High glycogen stores\n• Low mitochondrial density\n• Low myoglobin content\n• Low capillary density\n• High myosin ATPase / glycolytic enzyme activity\n• High fatigability / low aerobic capacity / high anaerobic capacity\n• High force production / speed of contraction\n• White in colour.\nAccept other appropriate characteristics of fast twitch glycolytic muscle fibres (type IIx).\nMax 3 marks", "er": "This question was answered well with a mean mark of 2.04. Students were able to provide a wide range of answers. Schools and colleges should be aware of the requirement in the specification to teach both characteristics and functions of each muscle fibre type. While both were accepted here, characteristics are structural features which identify the muscle fibre type (eg large muscle fibre diameter), while its functions are the resultant capabilities of the fibre as a result of its structure (eg high force of contraction).", "type": "written", "img": "tennis_sh"},
  {"id": "EP59", "sub": "Respiratory System", "q": "The graph shows the relationship between the partial pressure of oxygen and the percentage oxygen saturation of:\n• haemoglobin at rest\n• haemoglobin during exercise\n• myoglobin.\n\n(a) Identify curves A, B and C on the graph. Write A, B or C next to each: haemoglobin at rest, haemoglobin during exercise, myoglobin. Use each letter only once. (3)\n\n(b) Using the graph, explain the role of haemoglobin and myoglobin during exercise. (4)", "marks": 7, "ao": "AO1", "ms": "(a) Haemoglobin at rest = B (1); Haemoglobin during exercise = C (1); Myoglobin = A (1)\n\n(b) Haemoglobin during exercise (sub max 2):\n• Transports oxygen in the blood / carries oxygen to the muscles (1)\n• Less saturation of haemoglobin with oxygen during exercise / lower affinity (1)\n• An increase in oxygen release / oxyhaemoglobin dissociation to the working muscles (1)\n• Muscles receive more oxygen (1)\nMyoglobin (sub max 2):\n• Stores / transports oxygen in the muscle (1)\n• Myoglobin has a higher affinity for oxygen (1)\n• Oxygen dissociates from myoglobin at a lower PO2 / myoglobin has a higher % saturation for any given PO2 (1)\nDo not accept 'myoglobin in muscle' only.\nMax 4 marks for part (b); 7 marks in total.", "er": "(a) This question required students to identify curves from the graphic, which was not done very well. Only 33% achieved full marks. (b) Most students scored at least two marks as many were able to say where haemoglobin and myoglobin are found. A large number of students did not refer to exercise or to the graph and so did not access the marks available for an explanation of their role, which is what the question demanded. Instead, they simply discussed the main role of myoglobin and haemoglobin in general terms. When an understanding of myoglobin was evident, students were able to recognise its high affinity for oxygen. Only 4% achieved the full four marks available.", "type": "written", "img": "odc"},
  {"id": "EP60", "sub": "Cardiovascular System", "q": "The skeletal muscle pump and valves within veins are venous return mechanisms. They help return blood back to the heart.\nDescribe how the skeletal muscle pump and valves work together to return blood to the heart.", "marks": 3, "ao": "AO1", "ms": "A. The skeletal muscles contract compressing the veins.\nBlood vessels too vague\nB. This squeezes / forces blood back to the heart.\nC. (One way) valves prevent the backflow of blood.\nD. When blood has been squeezed through, valve closes.\nMax 3 marks", "er": "Most students accessed marks on this question, as they were able to describe how the skeletal muscle pump and valves work together to return blood to the heart. 43% achieved the full three marks by referring to the first three points on the mark scheme. The least accessed point on the mark scheme related to the valves closing, which only a small number of students recognised.", "type": "written"},
  {"id": "EP61", "sub": "Cardiovascular System", "q": "Explain the role of adrenaline on heart rate prior to and during a 400 m race.", "marks": 3, "ao": "AO2", "ms": "A. Anticipatory rise happens prior to the race.\nHas to be explained in correct context prior to the race\nB. Maintains increased heart rate during race.\nC. (Adrenaline) to the sino-atrial / SA node.\nD. Increased activity / firing at the SA node.\nMax 3 marks", "er": "Most students were able to achieve at least one mark for this question but only 7% achieved the full three marks. Anticipatory rise was a well-known term in relation to the role of adrenalin before the race and that an increased heart rate was maintained during the race. The action of adrenalin on the heart and specifically the SA node was not commonly known by students.", "type": "written"},
  {"id": "EP62", "sub": "Respiratory System", "q": "Explain the importance of haemoglobin for a long distance runner.", "marks": 3, "ao": "AO2", "ms": "A. Important for oxygen transport in the blood / carries oxygen to the muscles\nB. Endurance athletes work aerobically\nWith oxygen too vague\nC. Increased red blood cells, increased aerobic capacity / stamina\nD. Delays fatigue / delayed OBLA / prevents build-up of lactic acid\nMax 3 marks", "er": "Most students could describe the function of haemoglobin but then were not able to explain its importance to the long distance runner in the question. Long distance running being an aerobic event was generally missed and so students were then not able to access all of the marks available.", "type": "written"},
  {"id": "EP63", "sub": "Energy Systems", "q": "The aerobic system is an important energy system for many sports.\nDescribe the process of ATP resynthesis in the mitochondria.", "marks": 4, "ao": "AO1", "ms": "4 marks for 4 of:\nA. Breakdown of pyruvic acid / pyruvate / glycerol / fatty acids\nB. Converted to acetyl CoA\nC. Krebs Cycle\nD. Oxidation of citric acid\nE. Production of carbon dioxide\nF. Produces 2 molecules of ATP\nG. Electron transport chain\nH. Water formed / Hydrogen combines with oxygen\nI. Produces 34/32-36 molecules of ATP\nDo not accept diagrams.\nMax 4 marks", "er": "This question required students to describe the process of ATP resynthesis in the mitochondria. Many students had a good understanding of the process and provided accurate and structured answers. Over half of students achieved maximum marks.", "type": "written"},
  {"id": "EP64", "sub": "Cardiovascular System", "q": "Which one of the following statements accurately describes Starling's law of the heart?\nA) Increased action of skeletal muscles to increase venous return\nB) Increased heart rate during long periods of exercise at the same intensity\nC) Increased rate of oxygen transport by the circulatory system\nD) Increased venous return leading to increased stroke volume", "marks": 1, "ao": "AO1", "ms": "D – Increased venous return leading to increased stroke volume", "er": "", "type": "mcq", "answer": "D"},
  {"id": "EP65", "sub": "Movement Analysis", "q": "Identify the type of joint, the joint action and the main agonist at the leading ankle, as an athlete clears a hurdle.\nType of joint:\nJoint action:\nMain agonist:", "marks": 3, "ao": "AO1/AO2/AO3", "ms": "Award one mark for each of the following points.\nType of joint: Hinge (1)\nJoint action: Dorsiflexion (1)\nMain agonist: Tibialis anterior (1)\nMax 3 marks", "er": "", "type": "written"},
  {"id": "EP66", "sub": "Movement Analysis", "q": "To clear a hurdle, hip flexion occurs.\nState the plane and the axis around which hip flexion takes place.\nPlane:\nAxis:", "marks": 2, "ao": "AO1", "ms": "Award one mark for each of the following points.\nPlane: sagittal (plane) (1)\nAxis: transverse (axis) (1)\nMax 2 marks", "er": "", "type": "written"},
  {"id": "EP67", "sub": "Cardiovascular System", "q": "The graphs show the heart rates for two athletes before, during and after an exercise session. Each athlete is using a different training method.\nState the term used to describe the increase in heart rate labelled A and name the hormone that causes this increase in heart rate.", "marks": 2, "ao": "AO2", "ms": "Award one mark for each of the following points.\nAnticipatory rise (1)\nAdrenaline / epinephrine (1)\nMax 2 marks", "er": "", "type": "written", "img": "hr_graphs"},
  {"id": "EP68", "sub": "Respiratory System", "q": "Smoking is a poor lifestyle choice because of the negative effect it can have on health and performance.\nIdentify one physiological effect of smoking on the respiratory system and explain its impact on performance in endurance events.", "marks": 4, "ao": "AO1/AO2/AO3", "ms": "Award one mark for one of the following points.\nAO1 (Physiological effects)\nCarbon monoxide binds to haemoglobin rather than oxygen (1)\nNicotine constricts the bronchioles (1)\nDamaged cilia (1)\nReduction in number / damaged alveoli (1)\nPhysiological effects must relate specifically to the respiratory system\nSub-max 1 mark\nAward one mark for each of the following points.\nAO2\nReduced gaseous exchange in the lungs / oxygen transport to the muscles (1)\nAO3 (Impact on performance)\nThis decreases the athlete's ability to utilise oxygen in energy production / work aerobically (1). This means they have less energy for their activity / slower time / fatigue quicker (due to working anaerobically) (1).\nAccept other appropriate physiological effects of smoking on the respiratory system and explanations of the impact on performance in endurance events.\nMax 4 marks", "er": "", "type": "written"}
];

document.getElementById('qcount').textContent=QS.length+' QUESTIONS';
const SUBTOPICS=[...new Set(QS.map(q=>q.sub))];
let selSub=null,curQ=null,phase='select',ans='',conv=[],loading=false,currentTab='practice';

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='practice')||(i===1&&t==='browse')));
  document.getElementById('practice-panel').style.display=t==='practice'?'':'none';
  document.getElementById('browse-panel').style.display=t==='browse'?'':'none';
  if(t==='browse')renderBrowse();
  if(t==='practice')renderPractice();
}

function renderPractice(){
  const p=document.getElementById('practice-panel');
  if(phase==='select'){
    const counts={};QS.forEach(q=>{counts[q.sub]=(counts[q.sub]||0)+1;});
    p.innerHTML=`<div class="section-title">Select a topic area</div>
      <div class="topic-grid">${SUBTOPICS.map(s=>`
        <div class="topic-card${selSub===s?' sel':''}" onclick="selSub='${s}';renderPractice()">
          <div class="tc-name">${s}</div><div class="tc-count">${counts[s]} question${counts[s]>1?'s':''}</div>
        </div>`).join('')}
      </div>
      ${selSub?`<div class="btn-row"><button class="btn primary" onclick="startQ()">Get a question &rarr;</button><button class="btn" onclick="selSub=null;renderPractice()">Clear</button></div>`:''}`;
  } else if(phase==='answer'){
    p.innerHTML=`
      <div class="meta">
        <button class="btn" onclick="phase='select';renderPractice()">&#8592; Back</button>
        <span class="badge b-m">${curQ.marks} mark${curQ.marks>1?'s':''}</span>
        ${curQ.ao.split('/').map(a=>`<span class="badge b-${a.trim().toLowerCase()}">${a.trim()}</span>`).join('')}
        <span style="font-size:12px;color:#888;">${curQ.id} &middot; ${curQ.sub}</span>
      </div>
      <div class="qbox">${curQ.q}</div>${figHtml()}
      ${curQ.type==='mcq'?`
        <div class="card" style="margin-bottom:1rem;">
          <div class="label">Select your answer</div>
          ${['A','B','C','D'].filter(o=>curQ.q.includes(o+')')).map(o=>`
            <label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:14px;">
              <input type="radio" name="mcq" value="${o}" style="width:auto;"> ${o})
            </label>`).join('')}
        </div>
        <div class="btn-row"><button class="btn primary" onclick="submitMCQ()">Check answer &rarr;</button><button class="btn" onclick="newQ()">Different question</button></div>`:`
        <div style="margin-bottom:12px;">
          <label class="label">Your answer</label>
          <textarea id="ansbox" rows="${curQ.marks>=4?8:5}" placeholder="Write your answer here...">${ans}</textarea>
        </div>
        <div class="btn-row"><button class="btn primary" onclick="submitAns()">Submit for marking &rarr;</button><button class="btn" onclick="newQ()">Different question</button></div>`}`;
    const box=document.getElementById('ansbox');
    if(box)box.addEventListener('input',e=>ans=e.target.value);
  } else if(phase==='feedback'){
    p.innerHTML=`
      <div class="meta" style="margin-bottom:1rem;">
        <button class="btn" onclick="phase='answer';renderPractice()">&#8592; Edit answer</button>
        <button class="btn" onclick="phase='select';conv=[];ans='';renderPractice()">New topic</button>
        <button class="btn" onclick="newQ()">Next question</button>
      </div>
      <div class="qbox">${curQ.q}</div>${figHtml()}
      <div class="card"><div class="msg-role">Your answer</div><div class="msg-text">${ans||'[MCQ selected]'}</div></div>
      <div class="card" id="fb-card">
        <div class="msg-role">Examiner feedback</div>
        <div id="fb-content" style="font-size:14px;line-height:1.75;white-space:pre-wrap;">${loading?'<span class="spinner"></span>Marking your answer...':''}</div>
        ${curQ.er?`<div class="er-box" id="er-box" style="display:none;"><div class="er-label">📄 Examiner Report</div><div class="er-text">${curQ.er}</div></div>`:''}
      </div>
      ${!loading&&conv.length>0?`
        <div class="card" id="fu-card" style="display:none;"><div id="fu-msgs"></div></div>
        <div class="fu-row"><input type="text" id="fu-input" placeholder="Ask a follow-up question..." /><button class="btn primary" onclick="sendFU()">Ask &rarr;</button></div>`:''}`;
  }
}

function figHtml(){return curQ&&curQ.img&&IMGS[curQ.img]?`<div class="figbox"><img src="${IMGS[curQ.img]}" alt="Figure for question ${curQ.id}"></div>`:'';}
function startQ(){const pool=QS.filter(q=>q.sub===selSub);curQ=pool[Math.floor(Math.random()*pool.length)];ans='';conv=[];phase='answer';renderPractice();}
function newQ(){const pool=QS.filter(q=>q.sub===selSub);curQ=pool[Math.floor(Math.random()*pool.length)];ans='';conv=[];phase='answer';renderPractice();}

function submitMCQ(){
  const sel=document.querySelector('input[name="mcq"]:checked');
  if(!sel)return;
  ans='Selected: '+sel.value;phase='feedback';loading=true;renderPractice();
  const isRight=sel.value===curQ.answer;
  const text=isRight?`CORRECT — ${sel.value} is the right answer.\n\nWHY THIS IS CORRECT:\n${curQ.ms}\n\nEXAMINER REPORT:\n${curQ.er||'No specific examiner report.'}`:
    `INCORRECT — You selected ${sel.value}, but the correct answer is ${curQ.answer}.\n\nCORRECT ANSWER:\n${curQ.ms}\n\nEXAMINER REPORT:\n${curQ.er||'No specific examiner report.'}`;
  conv=[{role:'user',content:`Q${curQ.id} — Student selected: ${sel.value}`},{role:'assistant',content:text}];
  loading=false;renderPractice();
  const el=document.getElementById('fb-content');if(el)el.textContent=text;
  reportToTracker(isRight?100:0);
  const er=document.getElementById('er-box');if(er)er.style.display='';
  const fu=document.getElementById('fu-card');if(fu)fu.style.display='';
}

async function submitAns(){
  if(!ans.trim())return;
  phase='feedback';loading=true;renderPractice();
  const sys=`You are an AQA A-Level Physical Education examiner marking Exercise Physiology, Biomechanics and Health questions with precision.
Mark strictly to the mark scheme. Do not award marks for vague or inaccurate statements. If a student makes the correct point differently, award the mark.
EXAMINER REPORT FOR THIS QUESTION: ${curQ.er||'No specific examiner report.'}
Reference the examiner report in your feedback.
Some questions refer to a figure, graph or table that you cannot see: mark strictly against the mark scheme, and do not guess what the figure shows.
MARK SCHEME: ${curQ.ms}
FEEDBACK FORMAT:
MARKS AWARDED: [X] / [${curQ.marks}]
WHAT YOU GOT RIGHT:
[Each awarded mark — what the student said and why it earns the mark]
WHAT WAS MISSING:
[Each unawarded mark — precisely what was needed]
EXAMINER REPORT COMMENTARY:
[How the student's response compares to typical candidates]
HOW TO IMPROVE (B-U-C):
Basic | Use knowledge | Connect/contextualise`;
  const messages=[{role:'user',content:`Question ${curQ.id} (${curQ.marks} marks, ${curQ.ao}):\n${curQ.q}\n\nStudent's answer:\n${ans}`}];
  try{
    const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:1100,system:sys,messages})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||JSON.stringify(data);
    conv=[{role:'user',content:messages[0].content},{role:'assistant',content:text}];
    loading=false;renderPractice();
    const el=document.getElementById('fb-content');if(el)el.textContent=text;
    reportToTracker(extractPct(text));
    const er=document.getElementById('er-box');if(er)er.style.display='';
    const fu=document.getElementById('fu-card');if(fu)fu.style.display='';
  }catch(e){loading=false;const el=document.getElementById('fb-content');if(el)el.textContent='Error: '+e.message;}
}

async function sendFU(){
  const input=document.getElementById('fu-input');
  if(!input||!input.value.trim())return;
  const q=input.value.trim();input.value='';
  const fuMsgs=document.getElementById('fu-msgs');
  const fuCard=document.getElementById('fu-card');
  if(fuCard)fuCard.style.display='';
  if(fuMsgs){fuMsgs.innerHTML+=`<div class="msg"><div class="msg-role">You</div><div class="msg-text">${q}</div></div><div class="msg" id="fu-loading"><div class="msg-role">Tutor</div><div class="msg-text"><span class="spinner"></span>Thinking...</div></div>`;}
  const sys=`You are an AQA A-Level PE examiner providing follow-up tutoring on Exercise Physiology/Biomechanics. The question was: "${curQ.q}". Help the student understand the mark scheme reasoning.`;
  const msgs=conv.map(m=>({role:m.role,content:m.content}));msgs.push({role:'user',content:q});
  try{
    const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:400,system:sys,messages:msgs})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    conv.push({role:'user',content:q},{role:'assistant',content:text});
    const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent=text;
  }catch(e){const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent='Error.';}
}

function renderBrowse(){
  const p=document.getElementById('browse-panel');
  const byTopic={};QS.forEach(q=>{if(!byTopic[q.sub])byTopic[q.sub]=[];byTopic[q.sub].push(q);});
  p.innerHTML=Object.keys(byTopic).map(sub=>`
    <div class="section-title">${sub}</div>
    <div class="card" style="margin-bottom:1.25rem;">${byTopic[sub].map(q=>`
      <div class="q-item">
        <div class="q-id">${q.id}</div>
        <div class="q-txt">${q.q.split('\n')[0].substring(0,85)}${q.q.split('\n')[0].length>85?'...':''}</div>
        <div class="q-actions">
          <span class="badge b-m">${q.marks}m</span>
          ${q.type==='mcq'?'<span class="badge" style="background:#f3e8ff;color:#7c3aed;">MCQ</span>':''}
          <button class="btn" style="font-size:12px;padding:4px 10px;" onclick="practiseQ('${q.id}')">Practise</button>
        </div>
      </div>`).join('')}
    </div>`).join('');
}

function practiseQ(id){curQ=QS.find(q=>q.id===id);selSub=curQ.sub;ans='';conv=[];phase='answer';switchTab('practice');}
renderPractice();
</script>
