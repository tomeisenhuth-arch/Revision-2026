const QS=[
  {id:"Q1",sub:"Data & Testing",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"The table below shows data collected from gas analysis VO\u2082 max tests performed by football players on a treadmill. Each footballer performed the same test twice, one week apart.\n\nEvaluate the suitability of this VO\u2082 max test for football players. Refer to the validity and reliability of the test protocol and the results in the table above.",
  diagram:VO2_TABLE,levels:L4,
  ms:`AO1: Validity = extent to which a test measures what it sets out to measure. Reliability = extent to which a test produces consistent/repeatable results. VO2 max = maximum volume of oxygen taken in and used per minute (ml/kg/min).
AO2 Strengths: Aerobic power is important in football. Running on treadmill replicates football running. Gas analysis provides accurate/objective data.
AO2 Weaknesses: Continuous running unlike stop-start football. Requires maximal effort — not replicated in football. No skill/decision-making involved.
AO3 Validity: Valid because running on treadmill replicates football. Valid as direct measure of VO2 max important for some positions. Not valid — continuous unlike stop-start football. Not valid — doesn't involve skills/decision-making important in football.
AO3 Reliability: Reliable because standardised protocol followed each time. Not reliable — depends on player's preparation/condition on test day. Tests one week apart — minimal expected change. Footballer A, C, D show consistent results supporting reliability. Footballer B shows large change (46\u219261) calling reliability into question — may have been unwell/injured in Test 1, or human error occurred.`,
  er:"No specific examiner report. Both validity AND reliability must be evaluated, with explicit reference to the TABLE DATA throughout the AO3. Footballer B's anomalous data is the key evaluative opportunity — strong responses explain possible reasons."},

  {id:"Q2",sub:"Selective Attention & SAQ",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Goalkeepers in several sports need a fast response time to make a save.\n\nEvaluate how effective the following are for improving the response time of a goalkeeper:\n\u2022 development of selective attention\n\u2022 speed agility quickness (SAQ) training\n\u2022 caffeine supplementation.",
  levels:L5,
  ms:`AO1: Response time = reaction time + movement time. Selective attention = ability to focus on relevant stimuli and ignore irrelevant. SAQ training = dynamic movements/changing direction at speed/ladder drills. Caffeine = stimulant that increases mental alertness.
AO2: Selective attention — make ball brighter/highlight relevant stimuli/train with distractions. SAQ — multiple saves in different positions/ladder drills before saves. Caffeine — taken before performance to improve alertness/focus on ball.
AO3 SELECTIVE ATTENTION: Allows goalkeeper to ignore distractions (crowd) and focus on ball \u2192 decreases reaction time through anticipation. Only develops reaction time — still needs physical speed.
SAQ: Develops motor abilities \u2192 move more quickly \u2192 more saves. Only improves movement time — still needs accurate decision-making.
CAFFEINE: Increases focus \u2192 react more quickly. Effects wear off — needs more during game. Over-consumption: stomach problems/headaches/dehydration/irritability \u2192 negative performance effects.`,
  er:"No specific examiner report. All three methods must be evaluated, each with a positive AND limitation linked specifically to goalkeeper performance."},

  {id:"Q3",sub:"Nutrition",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"A triathlete will need vitamins, minerals, fibre and water to maintain the healthy functioning of their body.\n\nAnalyse how the OTHER food classes allow the triathlete to maximise their performance.",
  levels:L4,
  ms:`AO1: Carbohydrates = primary energy source especially at higher intensities (found in fruit/pasta). Fats = energy source at low intensities; saturated/unsaturated/trans. Protein = amino acids for growth and repair (meat/fish/eggs).
AO2: Carbohydrates — energy for high training volume/long race. Fats — energy for low-intensity long training sessions. Protein — repair muscle damage from long swim/bike/run training.
AO3: Carbohydrates allow completion of training sessions to maximum ability/races at full effort. Fats conserve glycogen stores for intense sections — prevent 'hitting the wall'. Fats transport fat-soluble vitamins. Unsaturated fats preferred — saturated may cause weight gain slowing the triathlete. Protein allows muscle growth/repair/recovery \u2192 stronger/more injury resistant.`,
  er:"No specific examiner report. Must analyse each food class (carbohydrate, fat, protein) in context of a triathlete's specific demands — both training and competition."},

  {id:"Q4",sub:"Musculo-Skeletal & Biomechanics",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Analyse how the musculo-skeletal AND lever systems operating at the knees AND ankles contribute to gaining maximum height in a volleyball jump.",
  levels:L5,
  ms:`AO1 Knee: Hinge joint. Femur and tibia articulate. Quadriceps/hamstrings antagonistic pair.
AO1 Ankle: Hinge joint. Tibia, fibula and talus articulate. Gastrocnemius/tibialis anterior antagonistic pair.
AO1 Levers: Fulcrum/pivot, resistance/load, effort.
AO2 Knee: Extension caused by quadriceps contracting isotonic concentrically. Third-class lever.
AO2 Ankle: Plantar flexion caused by gastrocnemius contracting isotonic concentrically. Second-class lever.
AO3 Knee (3rd class): Longer resistance arm — mechanical disadvantage. However: lever can move at high speed with greater range of movement \u2192 explosive jump into air. Larger/stronger quadriceps \u2192 greater force \u2192 jump higher.
AO3 Ankle (2nd class): Longer effort arm — mechanical advantage \u2192 high force production. Important as ankle lifts weight of whole body. The two lever systems combine/complement each other — force and speed together \u2192 maximum height.`,
  er:"No specific examiner report. Both knees AND ankles must be addressed. Both musculo-skeletal system AND lever system must be covered. The AO3 analysis must link the mechanical properties of each lever system to the impact on jump height."},

  {id:"Q5",sub:"Muscle Fibre & Newton's Laws",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"A sprinter is driving out of the blocks in a 100m race.\n\nAnalyse how the following factors help the sprinter to make an explosive start:\n\u2022 recruitment of muscle fibres\n\u2022 Newton's Laws of linear motion.",
  levels:L5,
  ms:`AO1 Muscle fibre: Motor unit = motor neurone + muscle fibres it stimulates. All or None Law. Spatial summation = impulses from multiple areas \u2192 action potential. Wave summation = repeated impulses \u2192 tetanic contraction.
AO1 Newton's Laws: 1st (Inertia) = body remains at rest until force acts. 2nd (Acceleration) = F=ma. 3rd (Action/Reaction) = equal and opposite reaction.
AO2: Spatial summation \u2192 more/bigger/fast-twitch motor units recruited. Newton's 1st — large enough force to overcome inertia from blocks. Newton's 2nd — mass constant so acceleration proportional to force; direction of force governs direction of acceleration. Newton's 3rd — internal force applied to blocks \u2192 equal and opposite force propels sprinter forward.
AO3: More motor units/FT fibres \u2192 maximum force \u2192 overcomes inertia faster. Acceleration directly proportional to force produced. Larger backward force on blocks \u2192 larger forward reaction force \u2192 faster exit. Force applied at correct angle \u2192 maximises start (too flat = fall; too high = limits horizontal acceleration). Tetanic contractions from wave summation \u2192 smooth efficient movement \u2192 speed production.`,
  er:"No specific examiner report. Both muscle fibre recruitment AND all three Newton's Laws must be addressed. The AO3 analysis must link each law and muscle fibre principle to the specific outcome for the sprinter."},

  {id:"Q6",sub:"Nutrition",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"Following intense exercise elite athletes are required to maximise their recovery.\n\nAnalyse how nutrition can contribute to effective recovery from intense exercise, resulting in improved performance in the future.",
  levels:L4,
  ms:`AO1: Carbohydrates, protein, water, sodium, vitamins, creatine — all relevant post-exercise nutrients.
AO2: Carbohydrate — replenish glycogen depleted during intense exercise. Protein/vitamins — repair muscle damage from intense work. Sodium/water — replace losses through sweat. Creatine — increase phosphocreatine stores/speed muscle recovery.
AO3: Replenishing carbohydrate/creatine \u2192 work at high intensity again in next session/competition. Allows more frequent hard training \u2192 maximise training gains. Protein/creatine for growth/repair \u2192 faster recovery/increased muscular hypertrophy \u2192 greater strength/power gains. Water prevents dehydration \u2192 allows removal of waste products (lactic acid) \u2192 prevents normal functioning disruption \u2192 faster recovery. Sodium replenishment \u2192 normal muscle cell function \u2192 prevents cramps \u2192 maintained recovery/performance.`,
  er:"No specific examiner report. Must analyse each nutrient's role specifically in POST-EXERCISE RECOVERY and link to improved future performance."},

  {id:"Q7",sub:"Training & Principles",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Hayley is training for a half marathon (21km). Her target is to run the race in 1 hour 45 minutes.\n\nThe table shows her training programme for the 6 weeks leading up to the race.\n\nEvaluate how well the principles of training have been applied to Hayley's training programme. Refer to ways that Hayley could improve her programme.",
  diagram:HAYLEY_TABLE,levels:L5,
  ms:`AO1: Specificity — training relevant to your activity/energy systems/muscles. Progressive overload — gradually increasing difficulty (FITT: Frequency/Intensity/Time/Type). Reversibility — adaptations lost if training stops. Recovery — rest days needed for adaptation.
AO2 Specificity: Running specific to aerobic system — relevant. But not specific to 21km race distance/time.
AO2 Progressive overload: Time progressively increased each week. Intensity increase unclear (may run slower for longer).
AO2 Reversibility: Consistent training limits reversibility.
AO2 Recovery: 2-3 days between sessions — adequate.
AO3 Specificity: Not specific to distance intended to run — could make programme more specific by increasing distance in week 1.
AO3 Progressive overload: Could add sessions in weeks 3-5 (frequency). Must ensure intensity also increases (pace). Could add Fartlek/interval training for variety/additional overload.
AO3 Reversibility: Only 2 sessions per week — some reversibility may occur between sessions.
AO3 Recovery: At least 48 hours between sessions — allows glycogen replenishment/DOMS recovery. Adding one additional session with adequate recovery is feasible.`,
  er:"No specific examiner report. Must evaluate ALL training principles (specificity, progressive overload, reversibility, recovery) with reference to the table. Suggestions for improvement must be specific and linked back to the programme shown."},

  {id:"Q8",sub:"Musculo-Skeletal & Biomechanics",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"A sprinter is driving out of the blocks in a 100m race.\n\nAnalyse how the lever systems operating at the ankle AND knee give the sprinter an effective start.\n\nInclude fully labelled diagrams of the lever systems in your answer.",
  levels:L4,
  ms:`AO1: Lever components = effort, fulcrum, resistance. 2nd class = resistance in middle. 3rd class = effort in middle. Mechanical advantage = effort arm \u00f7 resistance arm.
AO2: Ankle = second-class lever. Knee = third-class lever.
AO3 Ankle (2nd class): High mechanical advantage — effort arm longer than resistance arm \u2192 more force relative to effort \u2192 greater force to drive out of blocks/overcome inertia/accelerate faster.
AO3 Knee (3rd class): Low mechanical advantage/disadvantage — effort arm shorter than resistance arm \u2192 requires more effort but moves quickly over large range of motion \u2192 sprinter covers larger distance quickly as they drive out using powerful quadriceps.
Two systems combine/complement each other \u2192 powerful start with high force and speed.`,
  er:"No specific examiner report. Both ankle AND knee must be analysed. Diagrams should be fully labelled (E, F, R). The AO3 must link mechanical advantage/disadvantage to the specific impact on the sprint start."},

  {id:"Q9",sub:"Gas Exchange & Physiology",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Analyse how using a hyperbaric chamber would help rehabilitation from a muscle strain.\n\nRefer to the following in your answer:\n\u2022 gas exchange at the alveoli and muscles\n\u2022 transportation of oxygen.",
  levels:L5,
  ms:`AO1: Hyperbaric chamber = delivers oxygen at ~2.5x normal pressure/100% pure oxygen. Muscle strain = muscle fibres stretched too far/tear. Gas exchange = movement of gases by diffusion (high\u2192low partial pressure). Transport = red blood cells/haemoglobin carry oxygen.
AO2: High partial pressure in chamber \u2192 larger diffusion gradient between alveolar air and blood. More oxygen diffuses into blood \u2192 haemoglobin fully saturated \u2192 more oxyhaemoglobin. Excess oxygen dissolves in plasma. More oxygen reaches injured muscle. Higher diffusion gradient between blood and muscle cells \u2192 more oxygen into injured muscle. Myoglobin in muscle cells pulls additional oxygen in.
AO3: Increased oxygen supply \u2192 speeds up rehabilitation. Used by mitochondria \u2192 energy production \u2192 powers faster recovery. Anti-inflammatory effect \u2192 reduces pressure/swelling in muscle. Reduced pressure \u2192 less pain \u2192 more natural movement \u2192 limits additional complications. Stimulates white blood cell production. White blood cells encourage growth/regeneration of injured muscle fibres.`,
  er:"No specific examiner report. Must address both gas exchange (alveoli AND muscles) AND transportation of oxygen. The AO3 must link the increased oxygen supply to specific mechanisms of faster rehabilitation."},

  {id:"Q10",sub:"Injury & Screening",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"Elite-level rugby players are at high risk of suffering from musculo-skeletal injuries due to the physical nature of the sport.\n\nEvaluate the use of screening to prevent musculo-skeletal injuries in elite rugby.",
  levels:L4,
  ms:`AO1: Screening = series of tests to assess current musculo-skeletal condition. Can assess muscle imbalances/core strength/joint mobility/postural alignment/stress fractures.
AO2: Muscle imbalances (e.g. stronger quads/weaker hamstrings) \u2192 increased hamstring injury risk. Weak core \u2192 decreased stability during contact \u2192 injury. Limited ankle mobility \u2192 increased pressure on other joints in scrums/rucks. Hypermobile shoulders \u2192 dislocation risk in tackling. Postural defects \u2192 injury risk in scrummaging.
AO3 Positives: Pre-hab work \u2192 injuries avoided \u2192 no missed training/playing time. Individualised conditioning programmes target specific weaknesses. Detection allows bracing/surgery.
AO3 Negatives: Some tests not 100% accurate \u2192 false negatives \u2192 more serious injury later. Despite screening, injuries still occur in contact sport — unavoidable. Taping/bracing/protective equipment may be more effective than screening alone. False positives \u2192 unnecessary rest \u2192 reduced fitness. Psychological impact of identifying potential issues \u2192 anxiety \u2192 reduced commitment to tackle \u2192 increased injury risk.`,
  er:"No specific examiner report. Both positives AND negatives of screening must be evaluated. Each point must include the IMPACT — not just the advantage/disadvantage of screening."},

  {id:"Q11",sub:"Biomechanics",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Analyse how an athlete can maximise the distance a discus travels.\n\nUse your knowledge of the factors affecting horizontal displacement of projectiles and the Bernoulli principle in your answer.",
  levels:L5,
  ms:`AO1: Angle of release — dependent on height/landing height difference. Speed of release — greater speed \u2192 greater displacement. Height of release — greater height \u2192 greater displacement. Bernoulli principle — fast air flow = low pressure; slow air flow = high pressure.
AO2: Release height of discus greater than landing height. Faster spin \u2192 greater speed of release. Height depends on athlete's height/technique. Optimal angle of attack for Bernoulli effect = ~25-40 degrees. Athlete tries to optimise speed, height, angle of release AND angle of attack.
AO3: Release height > landing height \u2192 optimum angle of release is less than 45\u00b0. Angle above optimal \u2192 increased air resistance \u2192 slower speed \u2192 shorter distance. Speed of release increased through training (power development). Taller athletes with better technique \u2192 greater height of release. At optimal angle of attack: air over discus travels further \u2192 faster \u2192 low pressure. Air under discus travels less \u2192 slower \u2192 high pressure. Air moves from high to low pressure \u2192 lift \u2192 discus stays airborne longer \u2192 maximises distance.`,
  er:"No specific examiner report. Both horizontal displacement factors AND Bernoulli principle must be integrated throughout. AO3 must explain the mechanism of lift generation and link optimisation of all factors to maximised distance."},

  {id:"Q12",sub:"Training & Principles",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"A runner has followed a continuous training programme three times per week for six weeks to prepare for a 5km race. The race is in four weeks' time.\n\nAnalyse how applying the FITT principles to the runner's training could improve their performance during the race.",
  levels:L4,
  ms:`AO1: Frequency = how often training is carried out. Intensity = how hard you train. Time = duration of training. Type = method used during training.
AO2: Frequency — increase to 4 sessions per week. Intensity — work at higher average heart rate/speed. Time — increase duration from e.g. 30 to 40 minutes. Type — use Fartlek/interval training instead of continuous.
AO3: Applying FITT \u2192 progressive overload \u2192 continued adaptations (cardiac output/A-VO2 diff/myoglobin/lactate threshold). Allows runner to work at higher intensities for longer without fatiguing \u2192 consistently fast pace throughout race. Fartlek/interval training stresses both anaerobic and aerobic systems \u2192 develops sprint finish capability. Without FITT application, plateau in performance development \u2192 race performance not maximised.`,
  er:"No specific examiner report. All four FITT principles must be addressed. The AO3 must link FITT application to specific physiological adaptations AND to improved 5km race performance."},

  {id:"Q13",sub:"Biomechanics",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"Analyse how the gymnast makes use of the principle of conservation of angular momentum when performing a front tuck somersault.\n\nRefer to a graph showing the relationship between moment of inertia and angular velocity in your answer.",
  levels:L5,
  ms:`AO1: Angular momentum = moment of inertia \u00d7 angular velocity. Moment of inertia = body's reluctance to rotation. Angular velocity = rate of rotation around axis. Conservation principle = angular momentum remains constant if moment of inertia changes, angular velocity changes inversely.
AO2: High MI at start and end (open position). Low MI in middle (tucked position). Low angular velocity at start/end. High angular velocity in middle. Angular acceleration as somersault begins; angular deceleration as gymnast opens out. Angular momentum constant throughout.
AO3: Open position initially \u2192 large MI \u2192 low angular velocity. Tucking \u2192 mass closer to centre of mass \u2192 MI decreases \u2192 angular velocity increases \u2192 angular acceleration \u2192 full rotation occurs quickly \u2192 time for safe landing. Opening out \u2192 MI increases \u2192 angular velocity decreases \u2192 angular deceleration \u2192 slows rotation for controlled landing. Angular momentum conserved throughout — gymnast manipulates body position to control rotation speed without external torque.`,
  er:"No specific examiner report. Must reference the graph or describe how MI and angular velocity are inversely related at different points in the somersault. The AO3 must explain the chain: body position \u2192 MI change \u2192 angular velocity change \u2192 impact on performance."},

  {id:"Q14",sub:"Training & Fitness",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"A sedentary adult wants to improve their fitness using circuit training.\n\nEvaluate the effectiveness of circuit training to improve the fitness of the sedentary adult and the potential impact on completing everyday tasks.",
  levels:L4,
  ms:`AO1: Circuit training = series of exercises at set stations; can target different muscles; work/rest ratios varied. Fitness benefits: muscular endurance, cardiovascular endurance, strength, flexibility, body composition.
AO2: Suitable stations for sedentary adult: walking/step-ups/sit-ups/press-ups/dumbbell work/mobility activities. Work periods low/rest periods longer to reflect current fitness.
AO3 Positives: CV fitness improvements \u2192 everyday tasks completed with less effort/stress on body. Increased strength \u2192 objects lifted more easily. Muscular endurance \u2192 tasks sustained longer without fatigue. Improved flexibility \u2192 reach objects more easily. Better body composition \u2192 less weight to carry \u2192 tasks easier. Social/motivating element \u2192 likely to continue exercising \u2192 sustained benefits.
AO3 Negatives: May be too intense for highly inactive individual. Other methods may be more effective for specific components (e.g. continuous for stamina, weight training for strength).`,
  er:"No specific examiner report. Must evaluate both positives AND negatives, each with specific impact on completing everyday tasks. Application to a sedentary adult's current fitness level is key for AO2."},

  {id:"Q15",sub:"Training & Principles",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"Adam Peaty is a world record holder in the 100m breaststroke.\n\nAnalyse how Adam Peaty could structure macro, meso and micro cycles to benefit his performance.",
  levels:L4,
  ms:`AO1: Macrocycle = 1-4 year cycle (e.g. Olympic cycle). Mesocycle = 2-8 week block focusing on specific aspect. Microcycle = 1 week/individual sessions.
AO2: Macrocycle for Peaty: 4-year plan building to Olympics/World Championships. Mesocycle examples: aerobic base building phase/power development phase/race-specific phase/tapering. Microcycle: weekly plan e.g. Monday S&C/Tuesday race pace/Wednesday recovery.
AO3: Macrocycle allows long-term planning ensuring peak fitness for most important competition. Mesocycles allow targeted development of specific attributes at the right time. Tapering mesocycle before competition \u2192 fresh/rested \u2192 optimal performance. Microcycles ensure each week optimises training load without overtraining. Well planned periodisation \u2192 peaks at the right time \u2192 performs optimally in major championships.`,
  er:"No specific examiner report. Must address ALL THREE cycle lengths. The AO3 analysis must explain how each cycle level BENEFITS Peaty's performance at major championships specifically."},

  {id:"Q16",sub:"Muscle Fibre & Newton's Laws",marks:15,ao:"AO1=4 AO2=5 AO3=6",
  q:"A gymnast performs an explosive leap off the balance beam.\n\nAnalyse how Newton's Laws of linear motion AND the recruitment of muscle fibres allow the gymnast to perform this explosive movement successfully.",
  levels:L5,
  ms:`AO1: Newton's 1st (Inertia), 2nd (Acceleration: F=ma), 3rd (Action/Reaction). Motor unit = motor neurone + fibres. All or None Law. Spatial summation. Wave summation \u2192 tetanic contraction.
AO2: Gymnast must produce sufficient muscle contraction/force to overcome inertia and jump. Mass constant \u2192 acceleration = muscular force. At take-off, force applied to beam \u2192 equal/opposite force back onto gymnast. Spatial summation \u2192 more/bigger/FT motor units recruited. All movements involve tetanic contractions.
AO3: Recruitment of more motor units/FT fibres \u2192 maximise force \u2192 overcome inertia. Increases acceleration (directly proportional to force). Larger downward force on beam \u2192 larger upward reaction force from beam \u2192 jump higher. Higher jump \u2192 more time in air \u2192 aesthetically pleasing movement \u2192 more points. Correct angle of force on beam to maximise take-off angle (too flat = limited air time \u2192 deductions). Tetanic contractions from wave summation \u2192 smooth, aesthetically pleasing movements \u2192 more points.`,
  er:"No specific examiner report. All THREE Newton's Laws must be applied to the gymnast. Muscle fibre recruitment (All or None, spatial summation, wave summation, tetanic contraction) must all be addressed with analysis of impact on the explosive movement."},

  {id:"Q17",sub:"Biomechanics",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"Analyse how factors affecting stability can influence a rugby player making a tackle.",
  levels:L4,
  ms:`AO1: Centre of mass (COM), height of COM, width of base of support, mass, line of gravity, friction.
AO2: Tackler lowers COM by bending knees. Wide base of support (feet apart). Line of gravity through middle of base. Both feet in contact with ground. Large mass increases stability. Boots/studs improve friction. Wet ground/poor footwear may reduce friction.
AO3: Lowering COM \u2192 more stable \u2192 less likely to be unbalanced by the ball carrier. Optimal base of support — too wide reduces dynamics/ability to change direction; too narrow compromises stability. Line of gravity can shift toward edge of base to initiate a change of direction for the tackle. Altering COM height \u2192 enables different tackling styles (low = take legs; high = contest ball). Good friction through studs \u2192 maintains position \u2192 effective tackle. Excessive mass \u2192 less stable when moving dynamically.`,
  er:"No specific examiner report. Must cover multiple factors (COM height, base of support, line of gravity, mass, friction). The AO3 must analyse the OPTIMAL balance between stability and dynamic movement needed for effective tackling."},

  {id:"Q18",sub:"Training & Principles",marks:8,ao:"AO1=2 AO2=3 AO3=3",
  q:"Analyse how the use of periodisation can benefit the performance of an elite swimmer preparing for a major championship.",
  levels:L4,
  ms:`AO1: Periodisation = dividing training into blocks. Macrocycle/mesocycle/microcycle. Preparation/competition/transition/tapering/recovery.
AO2: Macrocycle = 4-year Olympic plan for swimmer. Preparation mesocycle = aerobic base/strength development. Competition mesocycle = race-specific intensity/lactate threshold work. Tapering = reduce volume, maintain intensity before championship. Transition = active recovery/cross-training after championship.
AO3: Periodisation ensures swimmer peaks at the right time for the championship. Progressive overload throughout mesocycles \u2192 continued physiological adaptations. Tapering allows recovery of muscle glycogen/neuromuscular function without detraining \u2192 fresh and fast for competition. Transition period prevents overtraining/injury from year-round high intensity. Without periodisation \u2192 risk of overtraining/injury/suboptimal performance at key competition.`,
  er:"No specific examiner report. Must address multiple cycle levels and phases. The AO3 should specifically analyse how periodisation maximises performance at the championship, including the tapering effect."},
];

const SUBTOPICS=[...new Set(QS.map(q=>q.sub))];
let selSub=null,curQ=null,phase='select',ans='',conv=[],loading=false,currentTab='practice';

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='practice')||(i===1&&t==='browse')));
  document.getElementById('practice-panel').style.display=t==='practice'?'':'none';
  document.getElementById('browse-panel').style.display=t==='browse'?'':'none';
  if(t==='browse')renderBrowse();
  if(t==='practice')renderPractice();
}

function toggleLevelGuide(){
  const body=document.getElementById('level-guide-body');
  const arrow=document.getElementById('level-arrow');
  if(body){body.style.display=body.style.display==='none'?'block':'none';}
  if(arrow){arrow.textContent=body.style.display==='none'?'\u25bc':'\u25b2';}
}

function renderPractice(){
  const p=document.getElementById('practice-panel');
  if(phase==='select'){
    const counts={};QS.forEach(q=>{counts[q.sub]=(counts[q.sub]||0)+1;});
    p.innerHTML=`
      <div class="tip-box"><div class="tip-label">\ud83d\udca1 Extended Response Marking</div>These questions are marked holistically using level descriptors. Aim to blend AO1+AO2+AO3 within sentences for top marks.</div>
      <div class="section-title">Select a topic area</div>
      <div class="topic-grid">${SUBTOPICS.map(s=>{const qs=QS.filter(q=>q.sub===s);const has8=qs.some(q=>q.marks===8);const has15=qs.some(q=>q.marks===15);return`
        <div class="topic-card${selSub===s?' sel':''}" onclick="selSub='${s}';renderPractice()">
          <div class="tc-name">${s}</div>
          <div class="tc-sub">${qs.length} question${qs.length>1?'s':''}${has8&&has15?' \u00b7 8 & 15 mark':has15?' \u00b7 15 mark':' \u00b7 8 mark'}</div>
        </div>`;}).join('')}
      </div>
      ${selSub?`<div class="btn-row"><button class="btn primary" onclick="startQ()">Get a question &rarr;</button><button class="btn" onclick="selSub=null;renderPractice()">Clear</button></div>`:''}`;
  } else if(phase==='answer'){
    const levelRows=curQ.levels.map(l=>`<div class="level-row"><div class="level-num">Level ${l.l}</div><div class="level-marks">${l.r} marks</div><div>${l.d}</div></div>`).join('');
    p.innerHTML=`
      <div class="meta">
        <button class="btn" onclick="phase='select';renderPractice()">&#8592; Back</button>
        <span class="badge ${curQ.marks===8?'b-8':'b-15'}">${curQ.marks} marks</span>
        <span class="badge b-ao">${curQ.ao}</span>
        <span style="font-size:12px;color:#888;">${curQ.id} &middot; ${curQ.sub}</span>
      </div>
      <div class="qbox">${curQ.q}</div>
      ${curQ.diagram?`<div style="background:#fff;border:1px solid #e0dfd8;border-radius:8px;padding:1rem;margin-bottom:1rem;">${curQ.diagram}</div>`:''}
      <div class="level-guide">
        <div class="level-guide-header" onclick="toggleLevelGuide()"><span>Level Descriptors</span><span id="level-arrow">\u25bc</span></div>
        <div class="level-guide-body" id="level-guide-body">${levelRows}</div>
      </div>
      <div style="margin-bottom:12px;">
        <label class="label">Your answer — write in continuous prose (aim for ${curQ.marks===8?'~200-250':'~350-450'} words)</label>
        <textarea id="ansbox" rows="${curQ.marks===8?10:15}" placeholder="Write your answer here...">${ans}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="submitAns()">Submit for marking &rarr;</button>
        <button class="btn" onclick="newQ()">Different question</button>
      </div>`;
    const box=document.getElementById('ansbox');
    if(box)box.addEventListener('input',e=>ans=e.target.value);
  } else if(phase==='feedback'){
    p.innerHTML=`
      <div class="meta" style="margin-bottom:1rem;">
        <button class="btn" onclick="phase='answer';renderPractice()">&#8592; Edit answer</button>
        <button class="btn" onclick="phase='select';conv=[];ans='';renderPractice()">New topic</button>
        <button class="btn" onclick="newQ()">Next question</button>
      </div>
      <div class="qbox">${curQ.q}</div>
      ${curQ.diagram?`<div style="background:#fff;border:1px solid #e0dfd8;border-radius:8px;padding:1rem;margin-bottom:1rem;">${curQ.diagram}</div>`:''}
      <div class="card"><div class="msg-role">Your answer</div><div class="msg-text">${ans}</div></div>
      <div class="card" id="fb-card">
        <div class="msg-role">Examiner feedback</div>
        <div id="fb-content" style="font-size:14px;line-height:1.75;white-space:pre-wrap;">${loading?'<span class="spinner"></span>Applying level descriptors...':''}</div>
        ${curQ.er?`<div class="er-box" id="er-box" style="display:none;"><div class="er-label">\ud83d\udcc4 Examiner Report</div><div class="er-text">${curQ.er}</div></div>`:''}
      </div>
      ${!loading&&conv.length>0?`
        <div class="card" id="fu-card" style="display:none;"><div id="fu-msgs"></div></div>
        <div class="fu-row"><input type="text" id="fu-input" placeholder="Ask a follow-up question..." /><button class="btn primary" onclick="sendFU()">Ask &rarr;</button></div>`:''}`;
  }
}

function startQ(){const pool=QS.filter(q=>q.sub===selSub);curQ=pool[Math.floor(Math.random()*pool.length)];ans='';conv=[];phase='answer';renderPractice();}
function newQ(){const pool=QS.filter(q=>q.sub===selSub);curQ=pool[Math.floor(Math.random()*pool.length)];ans='';conv=[];phase='answer';renderPractice();}

async function submitAns(){
  if(!ans.trim())return;
  phase='feedback';loading=true;renderPractice();
  const levelDescriptors=curQ.levels.map(l=>`Level ${l.l} (${l.r} marks): ${l.d}`).join('\n');
  const sys=`You are an experienced AQA A-Level Physical Education senior examiner, expert in extended response marking for Exercise Physiology and Biomechanics.
CRITICAL: This is a LEVEL-MARKED question. Mark HOLISTICALLY using level descriptors. Do NOT count individual points.
QUESTION: ${curQ.q}
TOTAL MARKS: ${curQ.marks}
AO BREAKDOWN: ${curQ.ao}
${curQ.marks===8?'This is a 4-level question.':'This is a 5-level question.'}
LEVEL DESCRIPTORS:
${levelDescriptors}
KEY PRINCIPLES: AO1=knowledge accuracy/detail. AO2=application to specific context. AO3=coherent evaluation/analysis with impacts. BLENDING AO1+AO2+AO3 in same sentences = top levels.
MARK SCHEME (reference only):
${curQ.ms}
EXAMINER REPORT:
${curQ.er}
FEEDBACK FORMAT:
LEVEL AWARDED: Level [X] — [X] / ${curQ.marks} marks
WHY THIS LEVEL: [Holistic explanation referencing specific things the student wrote and which AO they demonstrate]
WHAT KEPT THIS FROM A HIGHER LEVEL: [Precise gap — name the exact missing element]
AO BALANCE:
AO1 Knowledge: [Weak/Developing/Secure/Strong]
AO2 Application: [Weak/Developing/Secure/Strong]
AO3 Evaluation: [Weak/Developing/Secure/Strong]
EXAMINER REPORT COMMENTARY: [How student compares to typical candidates]
TO REACH THE NEXT LEVEL: [Specific advice — show how to upgrade one of their existing points]`;
  const messages=[{role:'user',content:`Question ${curQ.id} (${curQ.marks} marks, ${curQ.ao}):\n${curQ.q}\n\nStudent's answer:\n${ans}`}];
  try{
    const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:1000,system:sys,messages})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||JSON.stringify(data);
    conv=[{role:'user',content:messages[0].content},{role:'assistant',content:text}];
    loading=false;renderPractice();
    const el=document.getElementById('fb-content');if(el)el.textContent=text;
    const er=document.getElementById('er-box');if(er)er.style.display='';
    const fu=document.getElementById('fu-card');if(fu)fu.style.display='';
    var _pct=extractPct(text);if(_pct!==null)reportToTracker(_pct);
  }catch(e){loading=false;const el=document.getElementById('fb-content');if(el)el.textContent='Error: '+e.message;}
}

async function sendFU(){
  const input=document.getElementById('fu-input');
  if(!input||!input.value.trim())return;
  const q=input.value.trim();input.value='';
  const fuMsgs=document.getElementById('fu-msgs');
  const fuCard=document.getElementById('fu-card');
  if(fuCard)fuCard.style.display='';
  if(fuMsgs){fuMsgs.innerHTML+=`<div class="msg"><div class="msg-role">You</div><div class="msg-text">${q}</div></div><div class="msg" id="fu-loading"><div class="msg-role">Tutor</div><div class="msg-text"><span class="spinner"></span>Thinking...</div></div>`;}
  const sys=`You are an AQA A-Level PE senior examiner providing follow-up tutoring on Physiology/Biomechanics extended responses. The question was: "${curQ.q}" (${curQ.marks} marks). Help the student understand how to improve their level placement.`;
  const msgs=conv.map(m=>({role:m.role,content:m.content}));msgs.push({role:'user',content:q});
  try{
    const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:500,system:sys,messages:msgs})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    conv.push({role:'user',content:q},{role:'assistant',content:text});
    const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent=text;
  }catch(e){const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent='Error.';}
}

function renderBrowse(){
  const p=document.getElementById('browse-panel');
  const byTopic={};QS.forEach(q=>{if(!byTopic[q.sub])byTopic[q.sub]=[];byTopic[q.sub].push(q);});
  p.innerHTML=Object.keys(byTopic).map(sub=>`
    <div class="section-title">${sub}</div>
    <div class="card" style="margin-bottom:1.25rem;">${byTopic[sub].map(q=>`
      <div class="q-item">
        <div class="q-num">${q.id}</div>
        <div class="q-txt">${q.q.split('\n')[0].substring(0,80)}${q.q.split('\n')[0].length>80?'...':''}</div>
        <div class="q-actions">
          <span class="badge ${q.marks===8?'b-8':'b-15'}">${q.marks}m</span>
          <button class="btn" style="font-size:12px;padding:4px 10px;" onclick="practiseQ('${q.id}')">Practise</button>
        </div>
      </div>`).join('')}
    </div>`).join('');
}

function practiseQ(id){curQ=QS.find(q=>q.id===id);selSub=curQ.sub;ans='';conv=[];phase='answer';switchTab('practice');}
renderPractice();
</script>
