<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
.header{background:#3b1a1a;color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:17px;font-weight:600;}
.header-sub{font-size:12px;opacity:.65;margin-top:2px;}
.header-badge{background:#c9a84c;color:#3b1a1a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.container{max-width:820px;margin:0 auto;padding:2rem 1.5rem;}
.tab-bar{display:flex;gap:2px;margin-bottom:1.5rem;background:#e8e7e3;border-radius:10px;padding:3px;}
.tab{flex:1;text-align:center;padding:8px;font-size:13px;cursor:pointer;border:none;background:transparent;border-radius:8px;color:#555;font-weight:500;}
.tab.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1rem;}
.topic-card{background:#fff;border:1.5px solid #e0dfd8;border-radius:10px;padding:.875rem;cursor:pointer;transition:all .15s;}
.topic-card:hover{border-color:#3b1a1a;background:#faf4f4;}

.tc-name{font-size:13px;font-weight:600;margin-bottom:3px;}
.tc-sub{font-size:11px;color:#888;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:1.5px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:#1a1a1a;transition:all .15s;}
.btn:hover{background:#f5f4f0;}
.btn.primary{background:#3b1a1a;color:#fff;border-color:#3b1a1a;}

.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}

.er-box{background:#fdf4f4;border:1px solid #f5c6c6;border-radius:8px;padding:.875rem 1rem;margin-top:1rem;}
.er-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9b1c1c;margin-bottom:5px;}
.er-text{font-size:13px;color:#7f1d1d;line-height:1.65;}
.msg{padding:10px 0;border-bottom:1px solid #f0f0ec;}
.msg:last-child{border-bottom:none;}
.msg-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:3px;}

.fu-row{display:flex;gap:8px;margin-top:1rem;}
.fu-row input{flex:1;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;background:#fafaf8;}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ccc;border-top-color:#3b1a1a;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-1px;}
@keyframes spin{to{transform:rotate(360deg);}}
.q-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0ec;}
.q-item:last-child{border-bottom:none;}

.section-title{font-size:14px;font-weight:600;margin-bottom:.75rem;color:#3b1a1a;}
.tip-box{background:#fdf4f4;border:1px solid #f5c6c6;border-radius:8px;padding:.875rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.6;color:#7f1d1d;}
.tip-label{font-size:11px;font-weight:700;text-transform:uppercase;color:#9b1c1c;margin-bottom:4px;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;margin:.75rem 0;}
table.data-table th,table.data-table td{border:1px solid #ddd;padding:6px 10px;text-align:center;}
table.data-table th{background:#3b1a1a;color:#fff;font-weight:600;}
table.data-table td:first-child{font-weight:600;text-align:left;}
.ao{padding:1px 0;border-radius:3px;color:#1a1a1a;}
.ao1{background:#ffc2df;}.ao2{background:#b9deff;}.ao3{background:#fff27a;}
.ao-tools{margin-top:.9rem;padding-top:.75rem;border-top:1px solid #f0f0ec;}
.ao-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:.6rem;}
.ao-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;color:#1a1a1a;}
.ao-note{font-size:12px;color:#888;margin-left:4px;}
.ao-btns{display:flex;gap:8px;flex-wrap:wrap;}
.buc-box{border:1.5px solid #b0206a;padding:0 4px;border-radius:2px;}
.buc-u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;}
.buc-c{border:2px solid #7a2a5c;border-radius:999px;padding:0 7px;}
</style>

<script>
const PROXY='https://wondrous-gaufre-bee751.netlify.app/.netlify/functions/proxy';
const MODEL='claude-sonnet-4-5';
/* === PE Tracker link (added) ============================================ */
const SUPA_URL='https://emrnfuomwdiyyrohczpr.supabase.co';
const SUPA_KEY='sb_publishable_Kx-oJE9vPNUdYAnkY6KFrA_D-tGKeUO';
const AREA_KEY='socio', AREA_AO=2;
const _tp=new URLSearchParams(location.search);
const STU_ID=_tp.get('sid'), STU_PIN=_tp.get('pin');
function extractPct(t){
  var norm=t.replace(/\[|\]/g,'').replace(/\bout of\b/gi,'/');
  var lv=norm.match(/LEVEL\s+AWARDED:?\s*Level\s*\d+\s*[\u2014\u2013-]\s*(\d+)\s*marks?\s*\/\s*(\d+)/i);
  if(!lv) lv=norm.match(/LEVEL\s+AWARDED:?\s*Level\s*\d+\s*[\u2014\u2013-]\s*(\d+)\s*\/\s*(\d+)\s*marks?/i);
  if(lv){var a=+lv[1],b=+lv[2];if(b>0)return Math.round(a/b*100);}
  var m=norm.match(/AWARDED:?\s*(\d+)\s*\/\s*(\d+)/i);
  if(!m) m=norm.match(/(\d+)\s*marks?\s*\/\s*(\d+)/i);
  if(!m) m=norm.match(/(\d+)\s*\/\s*(\d+)\s*marks/i);
  if(!m) m=norm.match(/[\u2014\u2013-]\s*(\d+)\s*\/\s*(\d+)/);
  if(m){var a=+m[1],b=+m[2];if(b>0)return Math.round(a/b*100);}
  return null;
}
function trackerNote(ok,title,msg){
  var c=document.getElementById('fb-card')||document.querySelector('.card');
  if(!c)return;
  var old=document.getElementById('trk-note');if(old)old.remove();
  var d=document.createElement('div');d.id='trk-note';d.className='er-box';
  d.style.background=ok?'#ecf4f0':'#fdf3e7';d.style.borderColor=ok?'#a7d7c5':'#f0c98f';
  d.innerHTML='<div class="er-label">'+title+'</div><div class="er-text">'+msg+'</div>';
  c.appendChild(d);
}
async function reportToTracker(pct){
  if(!STU_ID||!STU_PIN){trackerNote(false,'Not sent to your tracker','You opened this tutor without logging in. Close it and launch it from inside your tracker.');return;}
  if(pct===null){trackerNote(false,'Not sent to your tracker','The mark could not be read from this feedback. Try submitting your answer again.');return;}
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/rpc/ai_record',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:STU_ID,p_pin:STU_PIN,p_area:AREA_KEY,p_ao:AREA_AO,p_pct:pct})});
    if(!r.ok){trackerNote(false,'Not sent to your tracker','The tracker returned an error ('+r.status+'). Tell your teacher.');return;}
    trackerNote(true,'\u2713 Sent to your tracker','This result has updated your programme.');
  }catch(e){trackerNote(false,'Not sent to your tracker','Could not reach the tracker. Check your connection.');}
}

/* === resilient proxy calls (added) ====================================== */
async function aoFetch(url,opts){
  var last=null;
  for(var i=0;i<2;i++){
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},80000),r=null;
    try{ r=await fetch(url,Object.assign({},opts,{signal:ctl.signal})); }
    catch(e){
      var why=(e&&e.name==='AbortError')?'no reply after 80 seconds':((e&&e.message)||'network error');
      last=new Error('Could not reach the marking service ('+why+').');
    }
    clearTimeout(to);
    if(r){
      if(r.ok)return r;
      var body='';try{body=await r.text();}catch(_){}
      var msg='';try{msg=JSON.parse(body).error.message;}catch(_){}
      last=new Error('The marking service returned an error ('+r.status+')'+(msg?': '+msg:'.'));
      if([429,500,502,503,504,529].indexOf(r.status)<0)throw last;
    }
    if(i<1)await new Promise(function(ok){setTimeout(ok,2500);});
  }
  throw last;
}
function aoShowError(el,e){
  if(!el)return;
  var m=(e&&e.message)||'Unknown error';
  el.style.whiteSpace='normal';
  el.innerHTML='<div style="color:#7a4300;background:#fdf3e7;border:1px solid #f0c98f;border-radius:8px;padding:.8rem 1rem"><strong>Marking did not complete.</strong><br>'+aoEsc(m)+'<br><span style="font-size:13px">Your answer is still on this page. Press the button to try again. If it keeps happening, tell your teacher the message above.</span><div style="margin-top:.6rem"><button class="btn" onclick="submitAns()">Try marking again</button></div></div>';
}

/* === BUC + colour-coded marking (added) ================================== */
/* Pink = AO1 knowledge · Blue = AO2 application · Yellow = AO3 analysis / evaluation */
const AO_COL={AO1:'#ffc2df',AO2:'#b9deff',AO3:'#fff27a'};
const AO_NAME={AO1:'Knowledge',AO2:'Application',AO3:'Analysis / Evaluation'};
const AO_PROXY='https://wondrous-gaufre-bee751.netlify.app/.netlify/functions/proxy';
/* Short instruction added to the normal marking prompt (call 1) */
const AO_PROMPT_FB=[
'CONCISE AND B-U-C ALIGNED (follow exactly):',
'Keep the whole response under about 300 words. Do not use the letters B-U-C for improvement advice.',
'If the examiner report given for this question says none is available, leave out the EXAMINER REPORT COMMENTARY section entirely and never invent examiner comments.',
'Students are taught: Analyse = Identify + Impact; Evaluate = Judgement. Colours used in marking: pink = AO1 knowledge, blue = AO2 application to the context, yellow = AO3 analysis / evaluation.',
'In your improvement advice (HOW TO IMPROVE / TO REACH THE NEXT LEVEL), take ONE of the student\'s own points and rewrite it upwards in three steps - the knowledge (pink), applied to the context (blue), then the impact or judgement (yellow) - as one or two improved sentences.'
].join('\n');
/* Separate short prompt for the colour-coded copy (call 2, runs in parallel) */
const AO_PROMPT_ANNOT=[
'You annotate an AQA A-Level PE student\'s answer using the B-U-C method and a colour code. Reply in exactly the format at the end - no other text.',
'',
'B-U-C: Box the command word, Underline the key content, Circle the context. Analyse = Identify + Impact. Evaluate = Judgement.',
'',
'COLOUR CODE for the student\'s own words:',
'AO1 (pink) = knowledge: accurate facts, terms, definitions and named theories, factors or processes.',
'AO2 (blue) = application: knowledge applied to the context, i.e. linked to the named performer, sport, situation or data in the question.',
'AO3 (yellow) = analysis / evaluation: for an Analyse question, a point that is identified AND has its impact on performance stated (cause then effect: "which means... resulting in..."); for an Evaluate question, a judgement - strengths and weaknesses weighed up, a comparison or a justified conclusion.',
'Text that earns nothing (repeats the question, vague, inaccurate or irrelevant) is NOT highlighted. Only use the AOs this question assesses. Be strict: a fact on its own is pink, not blue; application with no impact is blue, not yellow.',
'',
'FORMAT (exactly):',
'BOX: the command word and what it demands, in under 15 words',
'UNDERLINE: the key content the answer must cover, in under 15 words',
'CIRCLE: the context the answer must be applied to, in under 10 words, or "none (recall only)"',
'CHECK: one sentence saying which of box / underline / circle the student\'s answer missed, or "All three covered."',
'HIGHLIGHTS:',
'BOX | the command word(s), copied exactly from the QUESTION',
'UNDERLINE | one key term or topic, copied exactly from the QUESTION (one line per term, 2-4 lines)',
'CIRCLE | the context words, copied exactly from the QUESTION',
'AO1 | words copied exactly from the STUDENT\'S ANSWER',
'AO2 | words copied exactly from the STUDENT\'S ANSWER',
'AO3 | words copied exactly from the STUDENT\'S ANSWER',
'Use one line per span. Copy words VERBATIM: same spelling, same order, no ellipses, no paraphrasing. Student spans are 3-40 words each, working through the answer from start to finish, and must include every span that earns credit. If nothing in the answer earns credit, write "AO1 | none".'
].join('\n');

function aoEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function aoSplit(text){
  var i=text.search(/\n[ \t]*\**HIGHLIGHTS:?\**[ \t]*\n?/i);
  if(i<0)return{body:text.trim(),hl:null};
  var body=text.slice(0,i).trim(),rest=text.slice(i),hl={BOX:[],UNDERLINE:[],CIRCLE:[],AO1:[],AO2:[],AO3:[]};
  rest.split('\n').forEach(function(l){
    var m=l.replace(/\*\*/g,'').match(/^\s*(?:[-•]\s*)?(BOX|UNDERLINE|CIRCLE|AO[123])\s*[|:]\s*(.+?)\s*$/i);
    if(m){var q=m[2].replace(/^["“'‘]+|["”'’]+$/g,'').trim();if(q&&!/^none\.?$/i.test(q))hl[m[1].toUpperCase()].push(q);}
  });
  return{body:body,hl:hl};
}
function aoLabels(hay,quotes,order){
  var lab=new Array(hay.length),found=0,lost=0;
  function esc(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  order.forEach(function(key){
    (quotes[key]||[]).forEach(function(q){
      var words=q.split(/\s+/).filter(Boolean),hit=null;
      for(var n=words.length;n>=Math.min(words.length,5)&&!hit;n--){
        var m=new RegExp(words.slice(0,n).map(esc).join('\\s+'),'i').exec(hay);
        if(m)hit=[m.index,m.index+m[0].length];
      }
      if(hit){for(var k=hit[0];k<hit[1];k++)lab[k]=key;found++;}else lost++;
    });
  });
  return{lab:lab,found:found,lost:lost};
}
function aoPaint(hay,lab,render){
  var out='',i=0;
  while(i<hay.length){
    var j=i;while(j<hay.length&&lab[j]===lab[i])j++;
    out+=render(lab[i],aoEsc(hay.slice(i,j)));i=j;
  }
  return out;
}
function aoQuestionHtml(q,hl){
  var r=aoLabels(q,hl,['UNDERLINE','CIRCLE','BOX']);
  return aoPaint(q,r.lab,function(k,t){
    if(k==='BOX')return'<span class="buc-box" title="Box: command word">'+t+'</span>';
    if(k==='UNDERLINE')return'<span class="buc-u" title="Underline: key content">'+t+'</span>';
    if(k==='CIRCLE')return'<span class="buc-c" title="Circle: context">'+t+'</span>';
    return t;
  });
}
function aoAnswerHtml(a,hl){
  var r=aoLabels(a,hl,['AO1','AO2','AO3']);
  return{html:aoPaint(a,r.lab,function(k,t){
    return k?'<mark class="ao ao'+k.slice(2)+'" title="'+k+' '+AO_NAME[k]+'">'+t+'</mark>':t;
  }),found:r.found,lost:r.lost};
}
function aoLegend(){
  return['AO1','AO2','AO3'].map(function(k){return'<span class="ao-chip" style="background:'+AO_COL[k]+'">'+k+' '+AO_NAME[k]+'</span>';}).join('');
}
function aoStart(){
  var q=curQ,a=ans;
  var sys=AO_PROMPT_ANNOT+'\n\nQUESTION ('+q.marks+' marks, '+q.ao+'):\n'+q.q+'\n\nMARK SCHEME (for your reference only):\n'+(q.ms||'');
  window._aoP=aoFetch(AO_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:700,system:sys,messages:[{role:'user',content:"Student's answer:\n"+a}]})})
    .then(function(r){return r.json();})
    .then(function(d){var t=d&&d.content&&d.content[0]&&d.content[0].text;return t?{q:q,a:a,t:t}:null;})
    .catch(function(){return null;});
}
function aoShowFeedback(text){
  var el=document.getElementById('fb-content');if(el)el.textContent=text.trim();
  var snap={q:curQ,a:ans};
  (window._aoP||Promise.resolve(null)).then(function(r){aoApply(r,snap);});
}
function aoApply(r,snap){
  var ac=document.getElementById('ans-copy');
  if(!ac||curQ!==snap.q||ans!==snap.a||!ans||!ans.trim())return;
  var p=r?aoSplit(r.t):null;
  if(!p||!p.hl){ac.parentNode.insertAdjacentHTML('beforeend','<div class="ao-note" style="margin-top:.6rem">Colour-coded copy was not available this time.</div>');return;}
  var qb=document.querySelector('#practice-panel .qbox');
  if(qb)qb.innerHTML=aoQuestionHtml(curQ.q,p.hl);
  var card=ac.parentNode;
  if(qb&&p.body&&!document.getElementById('ao-decode')){
    var dc=document.createElement('div');dc.id='ao-decode';dc.className='card';
    dc.innerHTML='<div class="msg-role">Question decode (B-U-C)</div><div style="font-size:14px;line-height:1.7;white-space:pre-wrap;">'+aoEsc(p.body.replace(/^QUESTION DECODE[^\n]*\n?/i,''))+'</div>';
    card.parentNode.insertBefore(dc,card);
  }
  var a=aoAnswerHtml(ans,p.hl);
  ac.style.whiteSpace='pre-wrap';ac.innerHTML=a.html;
  var lg=document.createElement('div');lg.id='ao-tools';lg.className='ao-tools';
  lg.innerHTML='<div class="ao-legend">'+aoLegend()+'<span class="ao-note">Unhighlighted words earned no credit.</span></div>'+
    '<div class="ao-btns"><button class="btn" onclick="aoDownload()">Download marked copy</button><button class="btn" onclick="aoCopy()">Copy for Word / OneNote</button></div>';
  card.appendChild(lg);
  var fb=document.getElementById('fb-content');
  window._aoLast={q:aoQuestionHtml(curQ.q,p.hl),a:a.html,body:(fb?fb.textContent:'')};
}
function aoCopy(){
  var ac=document.getElementById('ans-copy');if(!ac)return;
  var r=document.createRange();r.selectNodeContents(ac);var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  try{document.execCommand('copy');}catch(e){}
  s.removeAllRanges();
  var b=document.querySelector('.ao-btns .btn:nth-child(2)');if(b){var t=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=t;},1500);}
}
function aoDownload(){
  var d=window._aoLast;if(!d)return;
  var css='body{font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#1a1a1a;line-height:1.7}h1{font-size:18px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#777;margin:1.5rem 0 .4rem}.q{background:#f5f4f0;padding:.8rem 1rem;border-radius:8px;white-space:pre-wrap}.a{white-space:pre-wrap;border:1px solid #ddd;border-radius:8px;padding:.8rem 1rem}.fb{white-space:pre-wrap;font-size:14px}.ao{padding:1px 0;border-radius:3px}.ao1{background:'+AO_COL.AO1+'}.ao2{background:'+AO_COL.AO2+'}.ao3{background:'+AO_COL.AO3+'}.buc-box{border:1.5px solid #b0206a;padding:0 4px}.buc-u{text-decoration:underline;text-decoration-thickness:2px}.buc-c{border:2px solid #7a2a5c;border-radius:999px;padding:0 6px}.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin-right:6px}';

FEEDBACK FORMAT:
LEVEL AWARDED: Level [X] — [X] / ${curQ.marks} marks
WHY THIS LEVEL: [Holistic explanation referencing specific things the student wrote]
WHAT KEPT THIS FROM A HIGHER LEVEL: [Precise gap]
AO BALANCE:
AO1 Knowledge: [Weak/Developing/Secure/Strong]
AO2 Application: [Weak/Developing/Secure/Strong]
AO3 Evaluation: [Weak/Developing/Secure/Strong]
EXAMINER REPORT COMMENTARY: [How student compares to typical candidates]
TO REACH THE NEXT LEVEL: [Specific advice with an example of how to upgrade one of their existing points]

${AO_PROMPT_FB}`;
  aoStart();
  const messages=[{role:'user',content:`Question ${curQ.id} (${curQ.marks} marks, ${curQ.ao}):\n${curQ.q}\n\nStudent's answer:\n${ans}`}];
  try{
    const res=await aoFetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:1000,system:sys,messages})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||JSON.stringify(data);
    conv=[{role:'user',content:messages[0].content},{role:'assistant',content:text}];
    loading=false;renderPractice();
    aoShowFeedback(text);
    var _pct=extractPct(text);if(_pct!==null)reportToTracker(_pct);
    const er=document.getElementById('er-box');if(er)er.style.display='';
    const fu=document.getElementById('fu-card');if(fu)fu.style.display='';
  }catch(e){loading=false;const el=document.getElementById('fb-content');if(el)aoShowError(el,e);}
}

async function sendFU(){
  const input=document.getElementById('fu-input');
  if(!input||!input.value.trim())return;
  const q=input.value.trim();input.value='';
  const fuMsgs=document.getElementById('fu-msgs');
  const fuCard=document.getElementById('fu-card');
  if(fuCard)fuCard.style.display='';
  if(fuMsgs){fuMsgs.innerHTML+=`<div class="msg"><div class="msg-role">You</div><div class="msg-text">${q}</div></div><div class="msg" id="fu-loading"><div class="msg-role">Tutor</div><div class="msg-text"><span class="spinner"></span>Thinking...</div></div>`;}
  const sys=`You are an AQA A-Level PE senior examiner providing follow-up tutoring on Sociology extended responses. The question was: "${curQ.q}" (${curQ.marks} marks). Help the student understand how to improve their level placement.`;
  const msgs=conv.map(m=>({role:m.role,content:m.content}));msgs.push({role:'user',content:q});
  try{
    const res=await aoFetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:500,system:sys,messages:msgs})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    conv.push({role:'user',content:q},{role:'assistant',content:text});
    const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent=text;
  }catch(e){const l=document.getElementById('fu-loading');if(l)l.querySelector('.msg-text').textContent='Error.';}
}

function renderBrowse(){
  const p=document.getElementById('browse-panel');
  const byTopic={};QS.forEach(q=>{if(!byTopic[q.sub])byTopic[q.sub]=[];byTopic[q.sub].push(q);});
  p.innerHTML=Object.keys(byTopic).map(sub=>`
    <div class="section-title">${sub}</div>
    <div class="card" style="margin-bottom:1.25rem;">${byTopic[sub].map(q=>`
      <div class="q-item">
        <div class="q-num">${q.id}</div>
        <div class="q-txt">${q.q.split('\n')[0].substring(0,80)}...</div>
        <div class="q-actions">
          <span class="badge ${q.marks===8?'b-8':'b-15'}">${q.marks}m</span>
          ${q.synoptic?'<span class="badge b-syn">⚡</span>':''}
          <button class="btn" style="font-size:12px;padding:4px 10px;" onclick="practiseQ('${q.id}')">Practise</button>
        </div>
      </div>`).join('')}
    </div>`).join('');
}

function practiseQ(id){curQ=QS.find(q=>q.id===id);selSub=curQ.sub;ans='';conv=[];phase='answer';switchTab('practice');}
renderPractice();
</script>
