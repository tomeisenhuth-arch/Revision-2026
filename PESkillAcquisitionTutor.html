/><text x="347" y="180" text-anchor="middle" font-size="10" fill="#555">6</text><line x1="404" y1="163" x2="404" y2="169" stroke="#333" stroke-width="1"/><text x="404" y="180" text-anchor="middle" font-size="10" fill="#555">7</text><line x1="460" y1="163" x2="460" y2="169" stroke="#333" stroke-width="1"/><text x="460" y="180" text-anchor="middle" font-size="10" fill="#555">8</text><text x="265" y="198" text-anchor="middle" font-size="11" fill="#333">Number of possible responses</text><text x="14" y="93" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90,14,93)">Response time (ms)</text><polyline points="65,100 122,78 178,63 235,53 291,45 347,40 404,36 460,33" fill="none" stroke="#1a2744" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="65" cy="100" r="4" fill="#1a2744"/><circle cx="122" cy="78" r="4" fill="#1a2744"/><circle cx="178" cy="63" r="4" fill="#1a2744"/><circle cx="235" cy="53" r="4" fill="#1a2744"/><circle cx="291" cy="45" r="4" fill="#1a2744"/><circle cx="347" cy="40" r="4" fill="#1a2744"/><circle cx="404" cy="36" r="4" fill="#1a2744"/><circle cx="460" cy="33" r="4" fill="#1a2744"/><text x="75" y="96" font-size="9" fill="#666">180ms</text></svg>`

const QS = [
  // INFORMATION PROCESSING
  {id:"Q1",sub:"Information Processing",q:"Which one of the following immediately follows the effector mechanisms in Whiting's information processing model?\nA) Feedback data\nB) Muscular system output data\nC) Perceptual mechanisms\nD) Translatory mechanisms",marks:1,ao:"AO1",ms:"B – Muscular system output data",er:"A multiple choice question on Whiting's model. Students frequently confuse the order of the central mechanisms. The correct order is: Perceptual → Translatory → Effector. After the effector mechanisms, the muscular system produces output data.",type:"mcq",answer:"B"},
  {id:"Q3",sub:"Information Processing",q:"The DCR process takes place during the first stage of the general information processing model.\n\nName the first stage of the general information processing model.",marks:1,ao:"AO1",ms:"Input. (1)\nMax 1 mark",er:"Just over 50% of students were able to identify the first stage. The most common error was confusing this model with the central components of Whiting's model.",type:"written"},
  {id:"Q4",sub:"Information Processing",q:"Describe each stage of the DCR process.\n\nD — Detection\nC — Comparison\nR — Recognition",marks:3,ao:"AO1",ms:"• (Detection) The performer detects a stimulus. (1)\n• (Comparison) The stimulus is compared to those stored in the memory / past experiences. (1)\n• (Recognition) The performer recognises which stimuli are relevant / what response is required. (1)\nMax 3 marks",er:"Nearly 50% achieved all 3 marks. However, bigger gaps in knowledge were evident — this was the question with the highest non-attempts across the paper (~5.5%). Students must describe ALL THREE stages with precision.",type:"written"},
  {id:"Q16",sub:"Information Processing",q:"Define the term 'psychological refractory period'.",marks:1,ao:"AO1",ms:"A delay when a second stimulus is presented before the first has been processed. (1)\nMax 1 mark",er:"Around 63% of students either didn't attempt or scored zero. Where students attempted but weren't credited, they often failed to identify what was being 'delayed' — it is a delay in response to the SECOND of two closely spaced stimuli. There was confusion between choice reaction/Hick's law and PRP.",type:"written"},
  {id:"Q17",sub:"Information Processing",q:"Explain why a psychological refractory period occurs.\n\nRefer to a sporting example in your answer.",marks:3,ao:"AO2",ms:"• The brain can only process one stimulus at a time / several stimuli in rapid succession cause a bottleneck. (1)\n• A clear sporting example: sidestep in rugby / fake in basketball / ball clipping the net in tennis. (1)\n• The performer must clear the response to the first stimuli before responding to the second. (1)\nMax 3 marks",er:"Students often started by defining PRP — not using the command word 'explain' correctly. There was confusion between choice reaction/Hick's law and PRP. PRP occurs between TWO CLOSELY SPACED stimuli, not many simultaneous ones. The best answers referred to clear sporting examples such as a ball clipping the net or a sidestep/dummy in a team game.",type:"written"},
  {id:"Q24",sub:"Information Processing",q:"The figure below shows the impact of the number of possible responses on response time.\n\nAnalyse the figure to suggest why response times may be longer when passing in football than at the start of a 100m race. Support your answer with data from the figure.",marks:3,ao:"AO3",ms:"• Start of 100m has one possible response which the graph suggests would result in a response time of 180ms. (1)\n• Passing in football has many possible responses so response time is longer — must include relevant data from a graph. (1)\n• Passing in football represents choice reaction time which takes longer / this can be explained by Hick's Law. (1)\nMax 3 marks",er:"Mean mark was around 0.8. In many cases students were not awarded marks as they failed to support their answers with DATA from the figure. In several cases data was included but was inaccurate which prevented marks from being awarded.",type:"written"},
  {id:"Q30",sub:"Information Processing",q:"Analyse how the short-term and long-term memory work together to allow an autonomous performer to make effective decisions during performance.",marks:3,ao:"AO3",ms:"• The autonomous performer will filter/retain the most important stimuli, and hold it in their STM. (1)\n• This information in STM will then be compared to a wide range of experiences stored in LTM to decide on the best course of action. (1)\n• An autonomous performer will have many well-learned/adaptable motor programmes/schema stored in their LTM to select from, moving the chosen response to STM to perform it. (1)\n• The autonomous performer will make quicker decisions due to ability to recognise key stimuli and compare to LTM — fast DCR process. (1)\nMax 3 marks",er:"This question requires students to show how STM and LTM INTERACT — not just describe each separately. Strong answers show the flow of information between systems specifically in the context of an AUTONOMOUS performer.",type:"written"},
  {id:"Q46",sub:"Information Processing",q:"Define the two types of anticipation. Give a sporting example for each type.",marks:4,ao:"AO1/AO2",ms:"AO1:\n• Temporal anticipation: Predicting WHEN something will happen. (1)\n• Spatial anticipation: Predicting WHERE / WHAT is going to happen. (1)\nAO2:\n• Temporal example: A football goalkeeper predicting WHEN a player is going to shoot. (1)\n• Spatial example: A football goalkeeper predicting WHERE the ball will go. (1)\nExamples must be specific to a named type of anticipation. Max 4 marks",er:"Not attempted by about 6% of students. There was a clear split — those who knew it got 4 marks; those who didn't got 0. Students who gained no marks failed to mention EITHER temporal or spatial. The definition must distinguish between WHEN (temporal) and WHERE/WHAT (spatial).",type:"written"},
  {id:"Q56b",sub:"Information Processing",q:"Define simple reaction time and choice reaction time.\n\nSimple reaction time:\nChoice reaction time:",marks:2,ao:"AO1",ms:"Simple reaction time: One stimulus and one response. (Must refer to BOTH stimulus AND response.) (1)\nChoice reaction time: Several stimuli and/or several responses. (Do not accept a generic definition of reaction time.) (1)\nMax 2 marks",er:"55% of students achieved zero marks. Students still did not refer to the number of RESPONSES as well as the number of stimuli — simply focusing on the number of stimuli. Some referred to 'reactions' instead of 'responses'. BOTH stimulus AND response must be referenced in the definition of simple reaction time.",type:"written"},
  {id:"Q57",sub:"Information Processing",q:"During a game of badminton, a player will use spatial anticipation and temporal anticipation.\n\nExplain how a player would use spatial anticipation and temporal anticipation.\nGive sporting examples from the game of badminton in your answer.",marks:4,ao:"AO2",ms:"Spatial anticipation:\n• WHAT — predicting what shot opponent will play in return. (1)\n• WHERE — player will move to the right place on court. (1)\nTemporal anticipation:\n• WHEN — predicting when the shuttle will come over the net. (1)\n• ACTION — player will move at the right time to reach the shuttle. (1)\nExamples must be specific to badminton. Max 4 marks",er:"Only 13% of students achieved 3 or 4 marks. Many achieved zero. The most common mistake was in the sporting examples — students gave an example of what the two types were but failed to say WHY a badminton player would USE them. Also: many students used the word 'anticipating' in their definitions, which repeats the question term and does not constitute a definition.",type:"written"},

  // MEMORY MODELS
  {id:"Q8",sub:"Memory Models",q:"A badminton player watches the flight of the shuttlecock and hears shouts from the crowd.\n\nWhich one of the following components of Baddeley and Hitch's working memory model involves deciding which of these pieces of information to attend to?\nA) Central executive\nB) Episodic buffer\nC) Phonological loop\nD) Visuospatial sketchpad",marks:1,ao:"AO2",ms:"A — Central executive",er:"Mean score approximately 0.55. Students' knowledge of working memory model continues to be inconsistent, even when examined via MCQs. The central executive is the 'controller' — it decides what gets attention.",type:"mcq",answer:"A"},
  {id:"Q19",sub:"Memory Models",q:"Baddeley and Hitch devised a model of the working memory.\n\nWhich component of this model coordinates sight, hearing, and movement information into sequences to be sent to the long-term memory?\nA) Central executive\nB) Episodic buffer\nC) Phonological loop\nD) Visuospatial sketchpad",marks:1,ao:"AO1",ms:"B — Episodic buffer",er:"Mean of approximately 0.47. The episodic buffer integrates information from multiple senses into a coherent episode before transferring to LTM. This question discriminated between high and low achieving students more effectively.",type:"mcq",answer:"B"},

  // SKILL CLASSIFICATION
  {id:"Q2",sub:"Skill Classification",q:"A swimmer performs a start in a race.\n\nWhich one of the following shows the correct classifications for a start in a swimming race?\nA) High organisation and continuous\nB) High organisation and discrete\nC) Low organisation and continuous\nD) Low organisation and discrete",marks:1,ao:"AO2",ms:"B — High organisation and discrete",er:"A swimming start is discrete (clear beginning and end) and high organisation (the sub-routines cannot easily be separated and practised individually — they must be performed as a whole).",type:"mcq",answer:"B"},
  {id:"Q13",sub:"Skill Classification",q:"Which one of the following is the correct skill classification for an overhead kick in football?\nA) Complex and low organisation\nB) Complex and high organisation\nC) Simple and low organisation\nD) Simple and high organisation",marks:1,ao:"AO2",ms:"B — Complex and high organisation",er:"Despite being a higher demand AO2 question, students found this fairly accessible with a mean of around 0.7. Skill classifications are commonly assessed and students appear familiar with this area.",type:"mcq",answer:"B"},
  {id:"Q22",sub:"Skill Classification",q:"Define the term 'continuous skill'. Give a sporting example.\n\nDefinition:\nSporting example:",marks:2,ao:"AO1/AO2",ms:"AO1 Definition: A skill with no clear beginning or end. (1)\nAO2 Example: Running / swimming / cycling (or any valid continuous skill). (1)\nMax 2 marks",er:"Mean approximately 1.5. Students had sound knowledge of continuous skills. Unusually, nearly a quarter of students could access only 1 mark — most commonly because they could define the term but were unable to give a sporting example.",type:"written"},
  {id:"Q23",sub:"Skill Classification",q:"Explain why bowling in cricket might not be placed exactly at either end of the Gross–Fine continuum.",marks:2,ao:"AO2",ms:"• Bowling can be placed towards gross / away from fine as it requires large muscle groups to generate speed. (1)\n• Bowling can be placed towards fine / away from gross as it requires smaller muscle groups for accuracy / produce spin. (1)\nMax 2 marks",er:"Mean mark around 0.9, with nearly all students scoring either 0 or 2 marks (very few scoring 1). Where students failed, it was often due to not explicitly linking their examples to either the term GROSS or FINE. Examiners cannot make links for students — they must be explicit.",type:"written"},
  {id:"Q36",sub:"Skill Classification",q:"All sports skills can be placed on a continuum from open at one end to closed at the other.\n\nWhich of the following would sit nearest to the closed end of the continuum?\nA) Bowling in cricket\nB) Centre pass in netball\nC) Long shot in golf\nD) Shot put in athletics",marks:1,ao:"AO2",ms:"D — Shot put in athletics",er:"Shot put sits nearest to the closed end because the environment is stable and predictable, the performer initiates movement in their own time, and the skill is performed the same way each time. Golf and bowling both involve some environmental variability.",type:"mcq",answer:"D"},
  {id:"Q53",sub:"Skill Classification",q:"Skilled movements are learned, economic and consistently successful.\n\nState three other characteristics of skill.",marks:3,ao:"AO1",ms:"Mark first 3 answers only:\n• Coordinated/controlled (1)\n• Fluency/flowing/smooth (1)\n• Adaptable (1)\n• Aesthetically pleasing (1)\n• Goal-orientated / predetermined results (1)\n• Precise/accurate/correct technique (1)\nMax 3 marks",er:"Over 40% accessed full marks. The most common error was repeating the characteristics named in the question (learned, economic, consistently successful). Several students did not realise that 'economic' and 'efficient' constitute the same answer.",type:"written"},

  // LEARNING THEORIES
  {id:"Q5",sub:"Learning Theories",q:"Explain how different strategies would allow a performer to overcome the following causes of a learning plateau:\n• Fatigue\n• Boredom\n• Lack of motivation",marks:3,ao:"AO2",ms:"Fatigue (sub max 1):\n• Rest to allow the performer to recover. (1)\n• Take regular breaks to restore energy levels. (1)\nBoredom (sub max 1):\n• Vary practice to make training more enjoyable. (1)\n• Change the coach so new ideas are brought to training. (1)\nLack of motivation (sub max 1):\n• Set new goals so the performer has something more challenging to aim for. (1)\n• Offer rewards/incentives so the performer will work harder. (1)\nMax 3 marks — one per cause; must use a connective to explain WHY the strategy works.",er:"'Explain' is an AO2 command word requiring at least one connective to identify the reason for the initial answer. The near 30% who did not achieve marks commonly 'stated' strategies offering no explanation. Best answers highlighted three DIFFERENT strategies and identified WHY they would work — without repeating the question wording.",type:"written"},
  {id:"Q9",sub:"Learning Theories",q:"Describe the role of more knowledgeable others (MKOs) in Vygotsky's social development theory.",marks:3,ao:"AO1",ms:"• Provides demonstrations/examples/advice focused on correct performance of the skill. (1)\n• Promotes positive values/behaviour/high effort/communication. (1)\n• Inter-psychological learning (between MKO and the performer). (1)\n• Develops the performer's intra-psychological learning / ability to construct an action. (1)\n• Helps the performer develop what they can do with help / what they cannot do yet. (1)\nMax 3 marks",er:"Mean approximately 1 out of 3. Over half were awarded one mark — typically the MKO providing demonstrations/examples/advice. Better answers referenced inter and intra psychological phases of learning and/or the zones of proximal development.",type:"written"},
  {id:"Q12",sub:"Learning Theories",q:"Which one of the following is most commonly described as trial and error learning?\nA) Insight learning\nB) Observational learning\nC) Operant conditioning\nD) Social development theory",marks:1,ao:"AO1",ms:"C — Operant conditioning",er:"Mean mark around 0.6. This specific link between operant conditioning and trial and error learning has been credited previously, but not examined so specifically. This may have identified a gap in students' understanding of different learning theories.",type:"mcq",answer:"C"},
  {id:"Q32",sub:"Learning Theories",q:"Describe the insight theory of learning.",marks:2,ao:"AO1",ms:"• Cognitive / involves problem-solving. (1)\n• Uses existing knowledge / past experiences. (1)\n• It focuses on the whole task / gestalt. (1)\nMax 2 marks",er:"Insight learning is frequently confused with observational learning or operant conditioning. The key distinguishing feature is the 'aha moment' — sudden problem-solving using cognitive processes and past experience, NOT through trial and error or watching others.",type:"written"},
  {id:"Q33",sub:"Learning Theories",q:"State two characteristics of a performer who is in the associative stage of learning.",marks:2,ao:"AO1",ms:"• In the practice stage. (1)\n• Uses trial and error. (1)\n• Still needs feedback. (1)\n• Starts to use intrinsic feedback / develop kinesthesis. (1)\n• Compares performance to others / modelling. (1)\n• Fewer errors made. (1)\nMax 2 marks",er:"Students must not describe characteristics of the COGNITIVE stage. The key distinguishing features of the ASSOCIATIVE stage are: fewer errors than cognitive, beginning to develop intrinsic/kinaesthetic feedback, still needs external feedback, and practice rather than trial-and-error dominates.",type:"written"},
  {id:"Q34",sub:"Learning Theories",q:"Define the term 'positive reinforcement'. Give a sporting example.",marks:2,ao:"AO1/AO2",ms:"AO1: A pleasant stimulus is given to increase the likelihood of a correct response. (1)\nAO2: Reward/certificate/trophy/praise is given when a correct response occurs. (1)\nMax 2 marks",er:"Positive reinforcement is frequently confused with negative reinforcement. Positive reinforcement ADDS a pleasant stimulus to INCREASE likelihood of a correct response. The sporting example must show something being GIVEN/ADDED after a correct response, not removed.",type:"written"},
  {id:"Q38",sub:"Learning Theories",q:"Define the terms negative reinforcement and punishment. Give a sporting example of each.",marks:4,ao:"AO1/AO2",ms:"Negative reinforcement:\n• AO1: Removal of an unpleasant stimulus to encourage the desired response. (1)\n• AO2: Coach stops shouting/removes criticism when the performer does something well. (1)\nPunishment:\n• AO1: Introduction of an unpleasant stimulus to break the SR bond / prevent the response recurring. (1)\n• AO2: A red card/penalty is awarded after a foul. (1)\nMax 4 marks",er:"Negative reinforcement is one of the most commonly misunderstood concepts. It is NOT punishment — it is the REMOVAL of something unpleasant to INCREASE the likelihood of the correct behaviour. Punishment ADDS something unpleasant to DECREASE incorrect behaviour. Students regularly confuse these and lose marks.",type:"written"},
  {id:"Q42",sub:"Learning Theories",q:"Which stage of learning is a performer at if they are creating a mental picture of the skill?\nA) Associative\nB) Autonomous\nC) Cognitive",marks:1,ao:"AO1",ms:"C — Cognitive",er:"51% of students correctly answered. This is a commonly examined area but continues to catch students out. Creating a mental picture / cognitive rehearsal is associated with the COGNITIVE (beginner) stage.",type:"mcq",answer:"C"},
  {id:"Q43",sub:"Learning Theories",q:"Operant conditioning is based upon developing a stimulus–response bond.\n\nExplain how a coach could strengthen the stimulus–response bond for a player passing a ball in a game of football.",marks:2,ao:"AO2",ms:"• Positive reinforcement: when a player makes the correct pass the coach offers praise/reward to encourage the correct response to be repeated. (1)\n• Negative reinforcement: a coach makes negative comments when a player miss-places a pass, but stops/removes these comments when the correct pass is made. (1)\nMust reference positive OR negative reinforcement to be credited. Max 2 marks",er:"Mean mark was 0.54. Marks were only awarded when the answer was explicitly linked to positive or negative reinforcement. Positive reinforcement was understood well; however, negative reinforcement was generally misunderstood — applied as punishment. Negative reinforcement is the REMOVAL of something negative to strengthen correct response.",type:"written"},
  {id:"Q49",sub:"Learning Theories",q:"Vygotsky's social development theory focuses on building learning in stages.\n\nExplain how this theory applies to a badminton player learning a new skill.",marks:4,ao:"AO2",ms:"• What can be done alone: e.g. grip racket, get into position and make contact with shuttle. (1)\n• What can be done with help from a coach: e.g. generating more power to clear shuttle further, better positioning. (1)\n• What cannot be done yet: e.g. generating consistent power/distance. (1)\n• To help/support: observe and copy others / social learning / set targets. (1)\n• Learn from More Knowledgeable Other (MKO) / take advice from coach. (1)\nMax 4 marks — must be applied to badminton.",er:"Not well answered — students had limited knowledge of Vygotsky's theory. Those who understood it well gained 3-4 marks. Some were taught the theory well but failed to APPLY it to badminton. The three zones (what I can do alone / with help / not yet) must be explicitly linked to a badminton skill.",type:"written"},
  {id:"Q50",sub:"Learning Theories",q:"Describe the four processes of observational learning.",marks:4,ao:"AO1",ms:"• Attention: Ensure performer takes notice — demonstration must be attractive/clear/accurate/stands out. (1)\n• Retention: Ability to remember/create a mental image of the skill — recall demonstration in memory. (1)\n• Motor reproduction: Capability to physically copy the demonstration — set appropriate level for success. (1)\n• Motivation: The drive/need/want to copy — achieved by giving praise/rewards/positive reinforcement. (1)\nSub-max 1 for simply listing the four processes without describing them.\nMax 4 marks",er:"About a third gained full marks; a similar percentage gained 0 marks. Students either knew this or didn't. Those who gained partial marks often identified the four processes but provided poor descriptions. The description must actually DESCRIBE the process — restating the name in different words will not be credited.",type:"written"},
  {id:"Q54",sub:"Learning Theories",q:"Vygotsky's Social Development Theory is a constructivist theory.\n\nOutline the three stages of development in this theory. Give a sporting example for each stage.",marks:3,ao:"AO2",ms:"Stages must be in correct order:\n• What can I do alone — e.g. hold a golf club and stand correctly. (1)\n• What can I do with help — e.g. swing the club and make contact with the ball with help from my coach. (1)\n• What can I not yet do — e.g. hit the golf ball with accuracy towards a target. (1)\nMax 3 marks",er:"Over 50% achieved 2+ marks, but this was the most common not-attempted question (2.3%). The most common error was confusing social development theory with the stages of learning (cognitive, associative, autonomous). These are DIFFERENT theories.",type:"written"},

  // PRACTICE METHODS
  {id:"Q6",sub:"Practice Methods",q:"Evaluate whether whole–part–whole is the most effective method of practice for developing a gymnastics floor routine.\n\nRefer to the stages of learning throughout your answer.",marks:3,ao:"AO3",ms:"Most effective (sub max 2):\n• Associative/autonomous gymnasts can maintain kinesthesis/fluency of the routine. (1)\n• Associative/autonomous gymnasts can isolate/work on their main weaknesses. (1)\nNot most effective (sub max 2):\n• Cognitive gymnasts may suffer cognitive overload / not be able to perform the whole routine. (1)\n• Cognitive/associative gymnasts may have several weaknesses / find it hard to identify one. (1)\n• May be dangerous for a cognitive gymnast to perform the whole routine. (1)\n• Progressive part practice may be more effective for a cognitive gymnast. (1)\nMax 3 marks — must include BOTH sides.",er:"Best answered of the short-answer AO3 questions (mean ~1.33, over 17% full marks). Where students performed well, they linked advantages/disadvantages to the different stages of learning, often picking up additional marks for suggesting more appropriate alternatives.",type:"written"},
  {id:"Q27",sub:"Practice Methods",q:"Define the term 'learning plateau'.",marks:1,ao:"AO1",ms:"A learning plateau occurs when a learner stops progressing / no improvement in performance is evident. (1)\nMax 1 mark",er:"Commonly missed. Students often confuse a plateau with regression — a plateau is a period of NO progress, not declining performance. The definition must include the idea of a TEMPORARY halt in improvement.",type:"written"},
  {id:"Q28",sub:"Practice Methods",q:"State two potential causes of a learning plateau.",marks:2,ao:"AO1",ms:"Accept first two answers only:\n• Performer not physically ready / task too difficult / goals too high (1)\n• Performer lacks ability to develop/modify current skills / reached potential (1)\n• Fatigue / lack of fitness (1)\n• Still developing mental model of a more complex skill (1)\n• Boredom / lack of motivation / goals not challenging enough (1)\n• Poor/low quality coaching / earlier faulty learning (1)\nMax 2 marks",er:"Students often repeat the same cause in different words — only one mark is awarded. Ensure causes are genuinely distinct (fatigue and boredom are separate; 'tired' and 'fatigued' are not).",type:"written"},
  {id:"Q29",sub:"Practice Methods",q:"Explain the advantages and disadvantages of using whole practice when learning a dance routine.",marks:4,ao:"AO2",ms:"Advantages:\n• Time efficient — can learn a new routine quickly for an upcoming competition or show. (1)\n• Fluency/relationship between subroutines is maintained — vital for an aesthetic dance. (1)\n• Mental picture of whole dance can be developed aiding memory/future performances. (1)\nDisadvantages:\n• A whole new dance routine may be too much information to remember. (1)\n• Doesn't allow development of weaker skills as the performer attempts the whole routine. (1)\n• May cause fatigue leading to errors/injury. (1)\nAnswers must be specifically linked to dance routine. Max 4 marks — must include both advantages AND disadvantages.",er:"Answers must be contextualised to dance/routines. Generic advantages/disadvantages of whole practice without reference to dance will not receive full marks. Both advantages AND disadvantages must be present.",type:"written"},
  {id:"Q35",sub:"Practice Methods",q:"Evaluate the impact of an athlete only using whole practice to develop their triple jump technique.",marks:4,ao:"AO3",ms:"For whole practice in triple jump (sub max 3):\n• Triple jump is fast/ballistic/closed in its nature. (1)\n• Provides a more realistic method / replicates the complete technique as in competition. (1)\n• Can aid consistency / creates autonomous performance / builds athlete confidence. (1)\n• Develops/maintains links between sub-routines (run-up, hop-step-jump phases) ensuring fluidity. (1)\nAgainst (sub max 3):\n• Increased physical demands leading to fatigue/injury. (1)\n• Information overload resulting in aspects of technique being missed. (1)\n• May have a technical weakness that cannot be targeted during whole practice. (1)\n• Triple jump can be broken down — other methods may be more appropriate. (1)\nMust include both for and against. Max 4 marks.",er:"The key to full marks is evaluation — not just a list. Students must present BOTH sides AND go beyond listing to say WHY whole practice is or isn't appropriate for the triple jump specifically. Linking the fast/ballistic/indivisible nature strengthens arguments for; the technical complexity of the three phases strengthens arguments against.",type:"written"},
  {id:"Q41",sub:"Practice Methods",q:"Discuss the effectiveness of using massed practice with performers in gymnastics.",marks:4,ao:"AO2",ms:"For massed practice in gymnastics (sub max 3):\n• Helps develop motor programmes / allows overlearning of a named gymnastic skill or routine. (1)\n• Increased sports-specific fitness due to repeatedly performing. (1)\n• Time efficient — allows learning of a specific routine in the lead-up to competition. (1)\n• Particularly suited to closed, self-paced skills like gymnastics. (1)\nAgainst (sub max 3):\n• Limited time for feedback which may limit error correction. (1)\n• Fatiguing which may decrease performance / increase injury risk in a dangerous sport. (1)\n• Boring/demotivating when performing the same skill repeatedly — lack of focus. (1)\nMust link to gymnastic performance. Max 4 marks.",er:"Must be a valid attempt to link advantages/disadvantages of massed practice to GYMNASTIC PERFORMANCE. Generic statements about massed practice not applied to gymnastics will not be credited. Both for and against must be present.",type:"written"},

  // TRANSFER OF LEARNING
  {id:"Q11",sub:"Transfer of Learning",q:"Divers often practise somersaults using trampolines.\n\nAnalyse how a coach can make sure positive transfer occurs between the somersaults practised on the trampoline and the somersaults performed into the water.",marks:3,ao:"AO3",ms:"• Coach highlights potential for positive transfer / points out similarities between the two movements. (1)\n• Limit the time between trampoline and real dive so the diver retains a feel for the movement. (1)\n• Practice sessions should be realistic — same time frame/movement patterns as in the real dive. (1)\n• Planned progressions to develop schema / motor programme. (1)\n• Repeatedly practise/overlearn the initial somersault to develop correct technique. (1)\n• Reward/reinforce when positive transfer is initially experienced. (1)\nMax 3 marks",er:"Students generally understood the command word 'analyse', offering both sides. However, their points lacked depth — frequently stating advantages and disadvantages without specific impact. In several cases students used points from the mark scheme for preventing NEGATIVE transfer, which failed to answer the question on ensuring POSITIVE transfer.",type:"written"},
  {id:"Q14",sub:"Transfer of Learning",q:"Negative transfer occurs when the learning of one skill hinders the learning of another.\n\nOutline two causes of negative transfer.",marks:2,ao:"AO1",ms:"• Performer misunderstanding the different movement requirements. (1)\n• First skill hasn't been fully learnt/overlearned. (1)\n• A familiar stimulus/cue requiring a new response. (1)\n• Skills that seem to be performed the same way but aren't. (1)\n• Conflicting skills are taught close together. (1)\n• Practice environment is different to competition environment. (1)\n• Poor coaching. (1)\nMax 2 marks",er:"Students mean as % of maximum marks was between 40-45%. Previous questions have tended to focus on promoting POSITIVE transfer, so this context was unfamiliar to many. Nearly 50% could identify ONE cause but less than 20% achieved two marks — indicating a lack of breadth of knowledge.",type:"written"},
  {id:"Q45",sub:"Transfer of Learning",q:"(a) Which skill will benefit from positive transfer if the performer can already serve in tennis?\nA) Backhand serve in table tennis\nB) Forehand serve in badminton\nC) Overarm serve in volleyball\n\n(b) State two ways a coach can encourage positive transfer of learning.",marks:3,ao:"AO2/AO1",ms:"(a) C — Overarm serve in volleyball (1)\n(b) Accept first two answers:\n• Making training realistic. (1)\n• Ensuring the first skill is well learned before moving on. (1)\n• Slow planned progression. (1)\n• Use of rewards/reinforcement to encourage positive transfer. (1)\n• Make performer aware of opportunities for positive transfer / highlight similarities. (1)\nMax 3 marks",er:"Around 77% of students accessed 1 mark but only about 27% continued to get the second mark. A common error was making generalised statements about ensuring skills were well learned. The key is that the first skill should be well learned BEFORE moving onto the second skill — or negative transfer may occur.",type:"written"},
  {id:"Q48",sub:"Transfer of Learning",q:"When considering transfer of learning, a skill learnt in netball may aid the learning of another skill in basketball.\n\nWhich one of the following types of transfer is best described by this statement?\nA) Bilateral\nB) Negative\nC) Positive\nD) Progressive",marks:1,ao:"AO1",ms:"C — Positive",er:"The most accessible question on the paper — nearly all students correctly identified this. Positive transfer is when learning one skill HELPS the learning of another.",type:"mcq",answer:"C"},
  {id:"Q60",sub:"Transfer of Learning",q:"Vicky is a badminton player. She has recently begun to play tennis.\n\nExplain the impact of negative and zero transfer of learning on Vicky's progress in tennis. Give examples from badminton and tennis to support your answer.",marks:4,ao:"AO2/AO3",ms:"Negative transfer (sub max 2):\n• Skills from badminton will HINDER the learning of skills in tennis. (1)\n• Example: in badminton forehand shots use a flexible wrist but in tennis the wrist should be firmer. (1)\nZero transfer (sub max 2):\n• Some badminton skills will have NO impact on Vicky's tennis due to differences in the skill. (1)\n• Example: in badminton players serve underarm but the serve is overarm in tennis. (1)\nDo not accept descriptions/definitions without application to Vicky.\nMax 4 marks",er:"Students who described definitions of negative and zero transfer without applying to Vicky's situation did not score marks. Examples must be specifically drawn from both badminton and tennis.",type:"written"},

  // GUIDANCE
  {id:"Q18",sub:"Guidance",q:"A trampolinist is learning to perform a somersault using a harness.\n\nEvaluate the use of mechanical guidance for this performer.",marks:3,ao:"AO3",ms:"Positives (sub max 2):\n• Improves confidence, so will attempt the somersault / be motivated to practise. (1)\n• Develops kinaesthetic awareness, so they can repeat the somersault without support. (1)\n• Keeps the performer safe / reduces injury risk, so they can perform many repetitions. (1)\nNegatives (sub max 2):\n• Becomes over-reliant on the harness, so will lack confidence to perform without it. (1)\n• Incorrect kinaesthetic awareness experienced, so they don't develop the appropriate feel for the movement. (1)\nMust include BOTH positives and negatives. Impact must be stated after the advantage/disadvantage.\nMax 3 marks",er:"Mean just over 1, only ~3% achieved full marks. Students commonly listed advantages and disadvantages WITHOUT any specific impact. For example, knowing injury risk is reduced but not evaluating THAT THEREFORE the trampolinist would be more confident. The most commonly credited answer: the trampolinist would become over-reliant, meaning they could not perform without it. Sub-max prevented awarding 3 marks for 3 points on the same side.",type:"written"},
  {id:"Q55",sub:"Guidance",q:"'Verbal guidance is a suitable way of introducing a new skill to a cognitive learner.'\n\nDiscuss this statement.",marks:4,ao:"AO3",ms:"Advantages (sub max 3):\n• Can be used with visual guidance to highlight specific cues for cognitive learner. (1)\n• Helps build correct mental image which a cognitive learner can refer back to. (1)\n• Positive feedback/verbal guidance can maintain motivation at the cognitive stage. (1)\nDisadvantages (sub max 3):\n• Too much information / information overload may confuse a cognitive learner. (1)\n• Verbal guidance during performance can cause the performer to lose concentration. (1)\n• Technical terms may not be understood by a cognitive performer. (1)\n• Incorrect verbal guidance may develop bad habits in a cognitive learner. (1)\n• Some performers may struggle to create a mental image from verbal guidance alone. (1)\nAll points must be applied to a COGNITIVE LEARNER. Max 4 marks.",er:"Mean 1.6 out of 4 — only 3.8% achieved full marks. Most commonly awarded marks: verbal guidance highlighting key cues when used with visual guidance, possibility of information overload, and that visual guidance may be more effective. Students often failed to discuss in enough detail. Marks were also awarded for noting that mechanical or manual guidance may be more appropriate.",type:"written"},

  // FEEDBACK
  {id:"Q47",sub:"Feedback",q:"(a) Give one example of positive feedback and one example of negative feedback in athletics.\n\n(b) Evaluate whether positive or negative feedback is most effective when coaching an athletics performer in the cognitive stage of learning.",marks:4,ao:"AO2/AO3",ms:"(a) AO2 — 2 marks:\n• Positive: praise when hurdle technique was good — must be specific to athletics. (1)\n• Negative: criticism when lead leg wasn't straight when hurdling — must be specific to athletics. (1)\n(b) AO3 — 2 marks:\n• Positive feedback is most effective as it increases confidence and maintains motivation in cognitive performers. (1)\n• Negative feedback can decrease confidence and motivation in cognitive performers. (1)\n• Negative feedback may still be required but must be presented in a way that doesn't have a negative impact. (1)\n• Too much/inaccurate positive feedback gives a false impression of success. (1)\nMax 4 marks",er:"(a) Around 56% answered well. Students who failed gave GENERIC examples or examples from a different sport. Examples MUST be specific to ATHLETICS.\n(b) Around 93% achieved at least 1 mark; 54% got full 2 marks. Those who achieved 1 typically highlighted positive feedback but failed to evaluate negative feedback's role. Both forms have a role — students should move away from the view that positive = always right.",type:"written"},
  {id:"Q52",sub:"Feedback",q:"Which types of feedback would be most appropriate for a performer in the cognitive stage of learning?\nA) Knowledge of performance, negative, intrinsic\nB) Knowledge of performance, positive, extrinsic\nC) Knowledge of results, negative, intrinsic\nD) Knowledge of results, positive, extrinsic",marks:1,ao:"AO2",ms:"D — Knowledge of results, positive, extrinsic",er:"Only 54% of students correctly identified D. Those who didn't most often confused D with B — the only difference is knowledge of results vs knowledge of performance. While both would be applicable, knowledge of RESULTS is considered most effective for a COGNITIVE performer.",type:"mcq",answer:"D"},
  {id:"Q59",sub:"Feedback",q:"In most sports, coaches can give feedback during a break in play.\n\nIdentify and describe two different types of feedback that a coach could give during a break in play. Give a sporting example to support each answer.",marks:4,ao:"AO1/AO2",ms:"Type 1 — Positive feedback:\n• AO1: Praising/recognising what is going well. (1)\n• AO2: e.g. taking a quick corner catching the defence out so the goal was scored. (1)\nType 2 — Negative feedback:\n• AO1: Criticism/information on weaknesses during play. (1)\n• AO2: e.g. the team keep giving away free kicks. (1)\nAlternative — Knowledge of performance:\n• AO1: KOP — coach explains why a technique is working or not working. (1)\n• AO2: e.g. player's shots going over the goal — coach explains the fault in technique. (1)\nOnly award max 2 marks for AO1 and 2 for AO2. Do not award for identifying type only without description.\nMax 4 marks",er:"Do not award marks for identifying the type of feedback only without an appropriate description. Sporting examples can relate to an individual performer or a team. Both IDENTIFICATION and DESCRIPTION are required.",type:"written"},

  // OBSERVATIONAL LEARNING
  {id:"Q21",sub:"Observational Learning",q:"Bandura's observational learning model describes how we learn from watching others. In sport this can take the form of a demonstration.\n\nOutline three factors that make a demonstration effective.",marks:3,ao:"AO1",ms:"Accept first three answers only:\n• The demonstration is accurate. (1)\n• Everyone can see / the demonstration is clear. (1)\n• Everyone is paying attention / motivated. (1)\n• Verbal guidance is included / specific cues highlighted. (1)\n• The demonstration is performed by a role model / significant other. (1)\n• The demonstration is within the observer's physical capability / stage of learning. (1)\n• The demonstration is broken down into sub-routines. (1)\n• Limited time between demonstration and practice. (1)\n• Repeated. (1)\nMax 3 marks",er:"Mean approximately 1.8. Students were successful in identifying a range of factors. Where marks were dropped, students' responses were sometimes too closely linked to be awarded separate marks (e.g. 'everyone can see it' and 'it is visible to all' = only one mark).",type:"written"},
  {id:"Q44",sub:"Observational Learning",q:"The third stage of Bandura's observational learning model is motor reproduction.\n\nWhich one of these best describes this stage?\nA) The performer is aware of what the skill should look like\nB) The performer is physically capable of copying the skill\nC) The performer is willing to practise the skill repeatedly",marks:1,ao:"AO1",ms:"B — The performer is physically capable of copying the skill",er:"This question had the highest proportion of correct answers of the multiple-choice questions — around 88% of students correctly identified the stages of observational learning.",type:"mcq",answer:"B"},
];

const SUBTOPICS = [...new Set(QS.map(q=>q.sub))];
let selSub=null,curQ=null,phase='select',ans='',conv=[],loading=false,currentTab='practice';

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='practice')||(i===1&&t==='browse')));
  document.getElementById('practice-panel').style.display=t==='practice'?'':'none';
  document.getElementById('browse-panel').style.display=t==='browse'?'':'none';
  if(t==='browse') renderBrowse();
  if(t==='practice') renderPractice();
}

function renderPractice(){
  const p=document.getElementById('practice-panel');
  if(phase==='select'){
    const counts={};
    QS.forEach(q=>{counts[q.sub]=(counts[q.sub]||0)+1;});
    p.innerHTML=`
      <div class="section-title">Select a subtopic</div>
      <div class="topic-grid">${SUBTOPICS.map(s=>`
        <div class="topic-card${selSub===s?' sel':''}" onclick="selSub='${s}';renderPractice()">
          <div class="tc-name">${s}</div>
          <div class="tc-count">${counts[s]} question${counts[s]>1?'s':''}</div>
        </div>`).join('')}
      </div>
      ${selSub?`<div class="btn-row">
        <button class="btn primary" onclick="startQ()">Get a question &rarr;</button>
        <button class="btn" onclick="selSub=null;renderPractice()">Clear</button>
      </div>`:''}`;
  } else if(phase==='answer'){
    p.innerHTML=`
      <div class="meta">
        <button class="btn" onclick="phase='select';renderPractice()">&#8592; Back</button>
        <span class="badge b-m">${curQ.marks} mark${curQ.marks>1?'s':''}</span>
        ${curQ.ao.split('/').map(a=>`<span class="badge b-${a.toLowerCase()}">${a}</span>`).join('')}
        <span style="font-size:12px;color:#888;">${curQ.id} &middot; ${curQ.sub}</span>
      </div>
      <div class="qbox">${curQ.q}</div>${getDiagram(curQ.id)}
      ${curQ.type==='mcq'?`
        <div class="card" style="margin-bottom:1rem;">
          <div class="label">Select your answer</div>
          ${['A','B','C','D'].filter(opt=>curQ.q.includes(opt+')')).map(opt=>`
            <label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:14px;">
              <input type="radio" name="mcq" value="${opt}" style="width:auto;"> ${opt})
            </label>`).join('')}
        </div>
        <div class="btn-row">
          <button class="btn primary" onclick="submitMCQ()">Check answer &rarr;</button>
          <button class="btn" onclick="newQ()">Different question</button>
        </div>` : `
        <div style="margin-bottom:12px;">
          <label class="label">Your answer</label>
          <textarea id="ansbox" rows="7" placeholder="Write your answer here...">${ans}</textarea>
        </div>
        <div class="btn-row">
          <button class="btn primary" onclick="submitAns()">Submit for marking &rarr;</button>
          <button class="btn" onclick="newQ()">Different question</button>
        </div>`}`;
    const box=document.getElementById('ansbox');
    if(box) box.addEventListener('input',e=>ans=e.target.value);
  } else if(phase==='feedback'){
    p.innerHTML=`
      <div class="meta" style="margin-bottom:1rem;">
        <button class="btn" onclick="phase='answer';renderPractice()">&#8592; Edit answer</button>
        <button class="btn" onclick="phase='select';conv=[];ans='';renderPractice()">New topic</button>
        <button class="btn" onclick="newQ()">Next question</button>
      </div>
      <div class="qbox">${curQ.q}</div>${getDiagram(curQ.id)}
      <div class="card">
        <div class="msg-role">Your answer</div>
        <div class="msg-text">${ans||'[MCQ selected]'}</div>
      </div>
      <div class="card" id="fb-card">
        <div class="msg-role">Examiner feedback</div>
        <div id="fb-content" style="font-size:14px;line-height:1.75;white-space:pre-wrap;">${loading?'<span class="spinner"></span>Marking your answer...':''}</div>
        ${curQ.er?`<div class="er-box" id="er-box" style="display:none;">
          <div class="er-label">&#128196; Examiner Report — what the chief examiner said about this question</div>
          <div class="er-text">${curQ.er}</div>
        </div>`:''}
      </div>
      ${!loading&&conv.length>0?`
        <div class="card" id="fu-card" style="display:none;"><div id="fu-msgs"></div></div>
        <div class="fu-row">
          <input type="text" id="fu-input" placeholder="Ask a follow-up question about this feedback..." />
          <button class="btn primary" onclick="sendFU()">Ask &rarr;</button>
        </div>`:''}`;
  }
}

function startQ(){
  const pool=QS.filter(q=>q.sub===selSub);
  curQ=pool[Math.floor(Math.random()*pool.length)];
  ans='';conv=[];phase='answer';
  renderPractice();
}

function newQ(){
  const pool=QS.filter(q=>q.sub===selSub);
  curQ=pool[Math.floor(Math.random()*pool.length)];
  ans='';conv=[];phase='answer';
  renderPractice();
}

function submitMCQ(){
  const selected=document.querySelector('input[name="mcq"]:checked');
  if(!selected) return;
  ans='Selected: '+selected.value;
  phase='feedback';loading=true;
  renderPractice();
  const correct=curQ.answer;
  const isRight=selected.value===correct;
  const text=isRight?
    `CORRECT — ${selected.value} is the right answer.\n\nWHY THIS IS CORRECT:\n${curQ.ms}\n\nEXAMINER REPORT COMMENTARY:\n${curQ.er||'No specific examiner report for this question.'}\n\nTip: Make sure you understand WHY this is correct, not just that it is — the examiner may ask this as a written question in future.`:
    `INCORRECT — You selected ${selected.value}, but the correct answer is ${correct}.\n\nCORRECT ANSWER: ${curQ.ms}\n\nEXAMINER REPORT COMMENTARY:\n${curQ.er||'No specific examiner report for this question.'}\n\nWHY STUDENTS GET THIS WRONG:\nThis is a common error area. Review this topic carefully and note the specific distinguishing feature that makes ${correct} correct.`;
  conv=[{role:'user',content:`Q${curQ.id} MCQ — Student selected: ${selected.value}`},{role:'assistant',content:text}];
  loading=false;
  renderPractice();
  const el=document.getElementById('fb-content');
  if(el) el.textContent=text;
  const er=document.getElementById('er-box');
  if(er) er.style.display='';
  const fu=document.getElementById('fu-card');
  if(fu) fu.style.display='';
}

async function submitAns(){
  if(!ans.trim()) return;
  phase='feedback';loading=true;
  renderPractice();
  const sys=`You are an experienced AQA A-Level Physical Education examiner marking student answers with precision and high standards.

MARKING RULES:
- Award marks strictly according to the mark scheme. Do not award marks for vague or inaccurate statements.
- If a student makes the correct point but phrases it differently, award the mark.
- Be specific about which mark-scheme point each mark corresponds to.
- Be honest — waffle does not earn marks.

async function sendFU(){
  const input=document.getElementById('fu-input');
  if(!input||!input.value.trim()) return;
  const q=input.value.trim();
  input.value='';
  const fuMsgs=document.getElementById('fu-msgs');
  const fuCard=document.getElementById('fu-card');
  if(fuCard) fuCard.style.display='';
  if(fuMsgs){
    fuMsgs.innerHTML+=`<div class="msg"><div class="msg-role">You</div><div class="msg-text">${q}</div></div>`;
    fuMsgs.innerHTML+=`<div class="msg" id="fu-loading"><div class="msg-role">Tutor</div><div class="msg-text"><span class="spinner"></span>Thinking...</div></div>`;
  }
  const sys=`You are an AQA A-Level PE examiner providing follow-up tutoring. The question was: "${curQ.q}". Examiner report: "${curQ.er||''}". Help the student understand the mark scheme reasoning without just handing them the answers. Use Socratic questioning to develop understanding.`;
  const msgs=conv.map(m=>({role:m.role,content:m.content}));
  msgs.push({role:'user',content:q});
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:getHeaders(),body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,system:sys,messages:msgs})});
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    conv.push({role:'user',content:q},{role:'assistant',content:text});
    const l=document.getElementById('fu-loading');
    if(l) l.querySelector('.msg-text').textContent=text;
  } catch(e){
    const l=document.getElementById('fu-loading');
    if(l) l.querySelector('.msg-text').textContent='Error. Please try again.';
  }
}

function renderBrowse(){
  const p=document.getElementById('browse-panel');
  const byTopic={};
  QS.forEach(q=>{if(!byTopic[q.sub]) byTopic[q.sub]=[];byTopic[q.sub].push(q);});
  p.innerHTML=Object.keys(byTopic).map(sub=>`
    <div class="section-title">${sub}</div>
    <div class="card" style="margin-bottom:1.25rem;">
      ${byTopic[sub].map(q=>`
        <div class="q-item">
          <div class="q-id">${q.id}</div>
          <div class="q-txt">${q.q.split('\n')[0].substring(0,85)}${q.q.split('\n')[0].length>85?'...':''}</div>
          <div class="q-actions">
            <span class="badge b-m">${q.marks}m</span>
            ${q.type==='mcq'?'<span class="badge" style="background:#f3e8ff;color:#7c3aed;">MCQ</span>':''}
            <button class="btn" style="font-size:12px;padding:4px 10px;" onclick="practiseQ('${q.id}')">Practise</button>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

function practiseQ(id){
  curQ=QS.find(q=>q.id===id);
  selSub=curQ.sub;
  ans='';conv=[];phase='answer';
  switchTab('practice');
}

renderPractice();
